<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Apostila MM · Comunidade Família Santa</title>
  <meta name="description" content="Acervo digital da Comunidade Família Santa: cânticos, orações, Bíblia e agenda. Busque, favorite e utilize durante a missa." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='20'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #F7F4EE;
  --bg-soft: #EDE8DE;
  --green: #263C35;
  --green-soft: #33493F;
  --gold: #B89555;
  --gold-soft: #E7D9BC;
  --text: #252525;
  --text-muted: #6B6558;
  --text-faint: #98917F;
  --card: #FFFFFF;
  --border: #E3DDCE;
  --danger: #A44B3F;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 22px;
  --shadow: 0 1px 2px rgba(38,60,53,0.05), 0 8px 24px rgba(38,60,53,0.06);
  --shadow-lift: 0 4px 10px rgba(38,60,53,0.08), 0 16px 40px rgba(38,60,53,0.10);
  --serif: 'Cormorant Garamond', 'Libre Baskerville', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --mono: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  --nav-h: 64px;
  --bottom-h: 64px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: calc(var(--bottom-h) + 12px);
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
::selection { background: var(--gold-soft); }

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ---------- Top header (desktop) ---------- */
header.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(247,244,238,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1040px;
  margin: 0 auto;
  padding: 0 22px;
  height: var(--nav-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
  color: var(--green);
  cursor: pointer;
}
.brand .mark {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--green);
  color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-size: 17px;
  flex-shrink: 0;
}
nav.top-nav {
  display: none;
  gap: 4px;
  align-items: center;
}
@media (min-width: 860px) {
  nav.top-nav { display: flex; }
}
nav.top-nav a {
  padding: 9px 15px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
}
nav.top-nav a:hover { color: var(--green); background: var(--bg-soft); }
nav.top-nav a[data-active="true"] { color: var(--green); background: var(--gold-soft); font-weight: 600; }
.admin-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  color: var(--text-faint);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.admin-link:hover { color: var(--green); border-color: var(--green); }
.admin-link svg { width: 16px; height: 16px; }

/* ---------- Bottom nav (mobile) ---------- */
nav.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--bottom-h);
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 60;
  padding-bottom: env(safe-area-inset-bottom);
}
@media (min-width: 860px) { nav.bottom-nav { display: none; } }
nav.bottom-nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-faint);
  font-size: 10.5px;
  font-weight: 600;
}
nav.bottom-nav a svg { width: 21px; height: 21px; }
nav.bottom-nav a[data-active="true"] { color: var(--green); }
nav.bottom-nav a[data-active="true"] svg { color: var(--gold); }

/* ---------- Hero ---------- */
.hero {
  text-align: center;
  padding: 56px 20px 30px;
}
.hero .kicker {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
}
.hero h1 {
  font-family: var(--serif);
  font-size: 44px;
  font-weight: 600;
  color: var(--green);
  margin: 0 0 12px;
  line-height: 1.15;
}
.hero p.sub {
  color: var(--text-muted);
  font-size: 16px;
  max-width: 480px;
  margin: 0 auto 30px;
  line-height: 1.5;
}
@media (max-width: 480px) {
  .hero h1 { font-size: 34px; }
  .hero { padding: 38px 18px 24px; }
}

.search-hero {
  max-width: 560px;
  margin: 0 auto;
  position: relative;
}
.search-hero input {
  width: 100%;
  padding: 18px 20px 18px 52px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 16px;
  color: var(--text);
  outline: none;
  box-shadow: var(--shadow);
  transition: box-shadow .15s, border-color .15s;
}
.search-hero input:focus { border-color: var(--gold); box-shadow: var(--shadow-lift); }
.search-hero svg {
  position: absolute;
  left: 20px; top: 50%; transform: translateY(-50%);
  width: 19px; height: 19px;
  color: var(--text-faint);
}

/* generic search bar (non-hero) */
.search-row { display: flex; gap: 8px; margin: 6px 0 16px; }
.search-box { flex: 1; position: relative; }
.search-box input {
  width: 100%;
  padding: 12px 14px 12px 40px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  font-size: 15px;
  color: var(--text);
  outline: none;
}
.search-box input:focus { border-color: var(--gold); }
.search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-faint); }
.icon-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-muted);
}
.icon-btn:hover { border-color: var(--gold); color: var(--green); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[data-active="true"] { background: var(--green); border-color: var(--green); color: #fff; }

/* ---------- Section titles ---------- */
.section {
  padding: 34px 0 4px;
}
.section-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 600;
  color: var(--green);
  margin: 0 0 4px;
}
.section-sub { color: var(--text-faint); font-size: 13.5px; margin-bottom: 18px; }

/* ---------- Explore cards ---------- */
.explore-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 14px;
}
@media (max-width: 520px) {
  .explore-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .explore-card { padding: 18px 15px; }
  .explore-card .icon { width: 38px; height: 38px; font-size: 18px; margin-bottom: 11px; }
  .explore-card h3 { font-size: 16px; }
}
.explore-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 26px 22px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.explore-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.explore-card .icon {
  width: 46px; height: 46px;
  border-radius: 14px;
  background: var(--bg-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 21px;
  margin-bottom: 16px;
}
.explore-card h3 {
  font-family: var(--serif);
  font-size: 20px;
  margin: 0 0 4px;
  color: var(--green);
}
.explore-card .count { color: var(--gold); font-weight: 700; font-size: 13.5px; }

/* ---------- Most accessed list ---------- */
.top-list { display: flex; flex-direction: column; gap: 2px; }
.top-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.top-row:last-child { border-bottom: none; }
.top-row .rank {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
  color: var(--gold);
  width: 26px;
  flex-shrink: 0;
}
.top-row .info { flex: 1; min-width: 0; }
.top-row .title { font-weight: 600; font-size: 15px; }
.top-row .sub { font-size: 12.5px; color: var(--text-faint); }
.top-row svg { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }

/* ---------- Tabs / chips ---------- */
.tabs-row {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.tab-item {
  padding: 10px 4px;
  margin-right: 20px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-faint);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  background: none;
  border-top: none; border-left: none; border-right: none;
}
.tab-item[data-active="true"] { color: var(--green); border-bottom-color: var(--gold); }

.chip-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 0 16px;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-muted);
  cursor: pointer;
  white-space: nowrap;
}
.chip[data-active="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.chip .count { opacity: .7; font-weight: 400; margin-left: 3px; }

.meta-row {
  display: flex; justify-content: space-between; align-items: baseline;
  color: var(--text-faint); font-size: 12.5px; margin-bottom: 12px;
}

/* ---------- Content list/cards ---------- */
.content-list { display: flex; flex-direction: column; gap: 8px; }
.content-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
}
.content-card:hover { border-color: var(--gold); }
.content-card .badge-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.content-card .info { flex: 1; min-width: 0; }
.content-card .title {
  font-weight: 600; font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.content-card .sub {
  font-size: 12.5px; color: var(--text-faint); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.content-card .cat-tag {
  font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  color: #fff; flex-shrink: 0; white-space: nowrap;
}
.fav-btn {
  width: 34px; height: 34px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer;
  color: var(--text-faint);
}
.fav-btn svg { width: 19px; height: 19px; }
.fav-btn[data-active="true"] { color: var(--gold); }
.fav-btn[data-active="true"] svg { fill: var(--gold); }

.letter-heading {
  font-family: var(--serif);
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--gold); margin: 22px 2px 6px;
}

.empty-state { text-align: center; padding: 70px 20px; color: var(--text-faint); }
.empty-state svg { width: 42px; height: 42px; margin-bottom: 12px; opacity: .5; }
.empty-state .cta { margin-top: 16px; }

/* ---------- Detail ---------- */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: none; background: none; color: var(--text-muted);
  font-size: 14px; cursor: pointer; padding: 8px 0; margin-bottom: 6px;
}
.back-btn svg { width: 16px; height: 16px; }
.back-btn:hover { color: var(--green); }

.detail-title-block { text-align: center; margin: 10px 0 22px; }
.detail-title-block h1 {
  font-family: var(--serif); font-size: 30px; margin: 0 0 6px; color: var(--green);
}
.detail-title-block .composer { color: var(--text-muted); font-size: 15px; margin-bottom: 12px; }
.badge-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 700; padding: 4px 11px; border-radius: 999px; color: #fff; }
.badge.outline { color: var(--text-muted); background: transparent; border: 1px solid var(--border); }

.detail-links { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.video-link {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
  font-size: 13px; color: var(--green); text-decoration: none; background: var(--card);
}
.video-link:hover { border-color: var(--gold); }
.video-link svg { width: 14px; height: 14px; flex-shrink: 0; }
button.video-link { font-family: inherit; cursor: pointer; }
button.video-link.primary-ish { background: var(--green); border-color: var(--green); color: #F7F4EE; font-weight: 600; }
button.video-link[data-pinned="true"] { border-color: var(--gold); color: var(--gold); }

/* legenda de cifras (diagramas de acorde), como no topo da apostila */
.chord-legend { margin: 4px 0 16px; }
.chord-legend-row { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
.chord-diagram { width: 60px; height: 80px; flex-shrink: 0; }
.chord-diagram .cd-name { font-family: var(--sans); font-size: 11px; font-weight: 700; fill: var(--green); }
.chord-diagram .cd-nut { fill: var(--text); }
.chord-diagram .cd-fretnum { font-size: 9px; fill: var(--text-muted); }
.chord-diagram .cd-fretline, .chord-diagram .cd-stringline { stroke: var(--border); stroke-width: 1; }
.chord-diagram .cd-barre { stroke: var(--gold); stroke-width: 6; stroke-linecap: round; }
.chord-diagram .cd-dot { fill: var(--gold); }
.chord-diagram .cd-open { fill: none; stroke: var(--text-muted); stroke-width: 1.3; }
.chord-diagram .cd-mute { font-size: 9px; fill: var(--text-faint); font-weight: 700; }

.detail-content {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px 18px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 640px) { .detail-content { padding: 26px 22px; } }
.detail-content pre {
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.6;
  white-space: pre;
  margin: 0;
  width: max-content;
}
.detail-content pre .chord-line { color: var(--gold); font-weight: 700; }
/* "somente letra": some o acorde e a letra passa a quebrar linha
   normalmente, já que sem cifra não é mais preciso manter o
   alinhamento em colunas de caractere. */
.detail-content.chords-hidden .chord-line { display: none; }
.detail-content.chords-hidden pre {
  white-space: pre-wrap;
  word-break: break-word;
  width: auto;
}
/* orações e sermões: texto corrido, não cifra. Sem fonte monoespaçada e
   sem alinhamento em colunas, com quebra de linha normal. */
.detail-content.text-mode pre {
  font-family: var(--sans);
  white-space: pre-wrap;
  word-break: break-word;
  width: auto;
  line-height: 1.75;
  max-width: 660px;
  margin: 0 auto;
}
.presentation .p-body.text-mode pre {
  font-family: var(--sans);
  white-space: pre-wrap;
  word-break: break-word;
  width: auto;
  max-width: 700px;
  line-height: 1.8;
}

/* aviso sutil de que dá pra arrastar para o lado, para quando mesmo no
   tamanho mínimo de fonte a linha mais longa da cifra não coube. */
.detail-content.has-hscroll::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 28px;
  background: linear-gradient(to right, rgba(255,255,255,0), var(--card));
  pointer-events: none;
  border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
}
.hscroll-hint {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-faint);
  margin: 8px 0 0;
  display: none;
}
.detail-content.has-hscroll ~ .hscroll-hint { display: block; }

.toolbar { display: flex; gap: 8px; justify-content: center; margin: 16px 0 4px; flex-wrap: wrap; }
.toolbar button, .toolbar a.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 15px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card);
  color: var(--text); font-size: 13.5px; cursor: pointer; text-decoration: none;
}
.toolbar button:hover { border-color: var(--gold); }
.toolbar button[data-active="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.toolbar svg { width: 15px; height: 15px; }
.toolbar .danger { color: var(--danger); }
.font-stepper { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.font-stepper button { border: none; border-radius: 0; background: var(--card); padding: 10px 13px; }

/* ---------- Prose page (about-like / empty pages) ---------- */
.prose-page { padding: 40px 0; }

/* ---------- Floating add (admin) ---------- */
.fab {
  position: fixed; right: 20px; bottom: calc(var(--bottom-h) + 20px);
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--green); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-lift); cursor: pointer; z-index: 40;
}
@media (min-width: 860px) { .fab { bottom: 28px; } }
.fab svg { width: 24px; height: 24px; }

/* ---------- Overlay / sheet ---------- */
.overlay {
  position: fixed; inset: 0; background: rgba(20,24,20,0.5);
  display: flex; align-items: flex-end; justify-content: center; z-index: 200;
}
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet {
  background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh;
  overflow-y: auto; border-radius: 20px 20px 0 0; padding: 22px 22px 32px;
}
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
.sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-header h2 { font-family: var(--serif); font-size: 22px; margin: 0; color: var(--green); }
.close-btn {
  border: 1px solid var(--border); background: var(--card);
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
}
.close-btn svg { width: 15px; height: 15px; }

.tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
  padding: 9px 4px; border: none; background: none; font-size: 13.5px; font-weight: 600;
  color: var(--text-faint); cursor: pointer; border-bottom: 2px solid transparent; margin-right: 14px;
}
.tab-btn[data-active="true"] { color: var(--green); border-bottom-color: var(--gold); }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 14.5px; font-family: var(--sans); outline: none;
}
.field textarea { font-family: var(--sans); resize: vertical; line-height: 1.55; }
/* só a letra com cifra precisa de fonte monoespaçada, para os acordes
   ficarem alinhados coluna a coluna com a sílaba certa */
#f-content, #paste-input { font-family: var(--mono); line-height: 1.5; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); }
.field .hint { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
.paste-area textarea { min-height: 220px; }

.primary-btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  background: var(--green); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
}
.primary-btn:hover { background: var(--green-soft); }
.primary-btn:disabled { opacity: .5; cursor: not-allowed; }
.secondary-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  background: transparent; color: var(--text); font-size: 14px; cursor: pointer; margin-top: 8px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
/* sem isto o ícone dentro do botão estica e ocupa a largura toda */
.primary-btn svg, .secondary-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
/* ---------- construtor de sermão ---------- */
.two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .two-cols { grid-template-columns: 1fr; gap: 0; } }
.pontos-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 18px 0 10px; }
.pontos-head label { font-size: 13px; font-weight: 600; color: var(--text); }
.add-ponto {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px dashed var(--border); background: transparent; color: var(--green);
  border-radius: 10px; padding: 8px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
}
.add-ponto:hover { border-color: var(--gold); }
.add-ponto svg { width: 13px; height: 13px; }
.ponto-card {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-soft); padding: 12px; margin-bottom: 10px;
}
.ponto-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.ponto-num {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--green); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700;
}
.ponto-titulo {
  flex: 1; min-width: 0; padding: 9px 11px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--card); font-size: 14px;
  color: var(--text); outline: none; font-family: inherit;
}
.ponto-titulo:focus { border-color: var(--gold); }
.ponto-del {
  flex-shrink: 0; width: 30px; height: 30px; border: none; background: none;
  color: var(--text-faint); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.ponto-del:hover { color: var(--danger); }
.ponto-del svg { width: 15px; height: 15px; }
.ponto-texto {
  width: 100%; min-height: 78px; padding: 10px 11px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--card); font-size: 14px;
  color: var(--text); outline: none; font-family: inherit; resize: vertical; line-height: 1.5;
}
.ponto-texto:focus { border-color: var(--gold); }
.settings-row button[data-on="true"] { background: var(--green); border-color: var(--green); color: #fff; }

.parse-preview {
  background: var(--bg-soft); border: 1px dashed var(--border); border-radius: 12px;
  padding: 14px; margin-bottom: 14px; font-size: 13px; color: var(--text-muted);
}
.parse-preview strong { color: var(--text); }

/* ---------- Admin ---------- */
.pin-gate { max-width: 340px; margin: 90px auto; text-align: center; }
.pin-gate h2 { font-family: var(--serif); color: var(--green); font-size: 24px; }
.pin-gate input {
  width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
  text-align: center; font-size: 22px; letter-spacing: 8px; margin: 16px 0; background: var(--card);
}
.admin-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 22px; }
@media (max-width: 560px) { .admin-stats { grid-template-columns: 1fr; } }
.admin-stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; }
.admin-stat .num { font-family: var(--serif); font-size: 30px; color: var(--green); font-weight: 700; }
.admin-stat .label { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.admin-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px;
}
.admin-row .info { flex: 1; min-width: 0; }
.admin-row .title { font-weight: 600; font-size: 14.5px; }
.admin-row .sub { font-size: 12px; color: var(--text-faint); }
.admin-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
.admin-row .actions button {
  border: 1px solid var(--border); background: var(--bg); border-radius: 8px;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted);
}
.admin-row .actions button svg { width: 15px; height: 15px; }
.admin-row .actions button:hover { border-color: var(--gold); color: var(--green); }

.settings-list { display: flex; flex-direction: column; gap: 10px; }
.settings-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 15px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px;
}
.settings-row .desc { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.settings-row button {
  border: 1px solid var(--border); background: transparent; color: var(--text);
  padding: 8px 13px; border-radius: 9px; font-size: 13px; cursor: pointer;
}
.settings-row button:hover { border-color: var(--gold); }

/* ---------- Modo Culto ---------- */
.culto-hero {
  text-align: center; padding: 30px 0;
}
.setlist { display: flex; flex-direction: column; gap: 8px; margin: 18px 0; }
.setlist-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
}
.setlist-item .num {
  font-family: var(--serif); color: var(--gold); font-weight: 700; font-size: 17px; width: 22px; flex-shrink: 0;
}
.setlist-item .info { flex: 1; min-width: 0; }
.setlist-item .title { font-weight: 600; font-size: 14.5px; }
.setlist-item button {
  border: none; background: none; color: var(--text-faint); cursor: pointer;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
}
.setlist-item button svg { width: 17px; height: 17px; }
.setlist-item button:hover { color: var(--danger); }

.playlist-bar { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; -webkit-overflow-scrolling: touch; }
.playlist-chip {
  flex-shrink: 0; border: 1px solid var(--border); background: var(--card); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
}
.playlist-chip .count { opacity: .65; font-size: 11.5px; }
.playlist-chip[data-active="true"] { background: var(--green); border-color: var(--green); color: #fff; }
.playlist-chip.playlist-new { border-style: dashed; color: var(--text-muted); }
.playlist-chip.playlist-new svg { width: 13px; height: 13px; }
.playlist-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-bottom: 14px; }
.playlist-actions button {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--border); background: var(--card); border-radius: 9px;
  padding: 7px 11px; font-size: 12.5px; color: var(--text-muted); cursor: pointer;
}
.playlist-actions button svg { width: 13px; height: 13px; }
.playlist-actions button.danger { color: var(--danger); }
.playlist-actions button:disabled { opacity: .4; cursor: not-allowed; }

.culto-add-box {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 18px;
}
.culto-search-results { max-height: 240px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.culto-search-results .csr-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); cursor: pointer; font-size: 13.5px;
}
.culto-search-results .csr-item:hover { border-color: var(--gold); }

/* ---------- Modo Culto em tela cheia (pensado para o celular na mão) ----------
   Sem cara de projeção em telão: texto alinhado à esquerda, alvos de toque
   grandes na parte de baixo (onde o polegar alcança) e barra superior enxuta. */
.presentation {
  position: fixed; inset: 0; background: var(--green); color: #F7F4EE; z-index: 300;
  display: flex; flex-direction: column;
}
.presentation .p-top {
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  border-bottom: 1px solid rgba(247,244,238,0.12);
}
.presentation .p-icon {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid rgba(247,244,238,0.25); background: transparent; color: #F7F4EE;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.presentation .p-icon svg { width: 17px; height: 17px; }
.presentation .p-meta { flex: 1; min-width: 0; }
.presentation .p-song {
  font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.presentation .p-sub {
  font-size: 12px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.presentation .p-dots { display: none; gap: 4px; flex-shrink: 0; }
@media (min-width: 520px) { .presentation .p-dots { display: flex; } }
.presentation .p-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(247,244,238,0.3); }
.presentation .p-dots i[data-on="true"] { background: var(--gold); }

.presentation .p-body { flex: 1; overflow: auto; padding: 18px 18px 28px; -webkit-overflow-scrolling: touch; }
.presentation .p-body pre {
  font-family: var(--mono); white-space: pre; margin: 0; line-height: 1.75; width: max-content;
}
.presentation .p-body pre .chord-line { color: var(--gold); font-weight: 700; }
.presentation .p-body.chords-hidden pre .chord-line { display: none; }
.presentation .p-body.chords-hidden pre {
  white-space: pre-wrap; word-break: break-word; width: auto; max-width: 680px; text-align: left;
}

.presentation .p-bottom {
  flex-shrink: 0; padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  border-top: 1px solid rgba(247,244,238,0.12); background: rgba(0,0,0,0.12);
}
.presentation .p-row-main { display: flex; align-items: center; gap: 10px; }
.presentation .p-nav {
  flex-shrink: 0; width: 52px; height: 52px; border-radius: 16px;
  border: 1px solid rgba(247,244,238,0.25); background: rgba(247,244,238,0.06); color: #F7F4EE;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.presentation .p-nav svg { width: 22px; height: 22px; }
.presentation .p-nav:disabled { opacity: .25; }
.presentation .p-play {
  flex: 1; height: 52px; border-radius: 16px; border: none;
  background: var(--gold); color: #241d0c; font-size: 15px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.presentation .p-play svg { width: 18px; height: 18px; flex-shrink: 0; }
.presentation .p-play[data-active="true"] { background: #F7F4EE; }
.presentation .p-row-tools {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
  overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch;
}
.presentation .p-row-tools::-webkit-scrollbar { display: none; }
.presentation .p-stepper, .presentation .p-tool {
  flex-shrink: 0; border: 1px solid rgba(247,244,238,0.25); border-radius: 11px;
  background: transparent; color: #F7F4EE; font-size: 12.5px; white-space: nowrap;
}
.presentation .p-stepper { display: inline-flex; align-items: center; overflow: hidden; }
.presentation .p-stepper span { padding: 0 9px; opacity: .8; }
.presentation .p-stepper strong { color: var(--gold); }
.presentation .p-stepper button {
  border: none; background: rgba(247,244,238,0.07); color: #F7F4EE;
  padding: 9px 13px; font-size: 13.5px; cursor: pointer;
}
.presentation .p-tool {
  padding: 9px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.presentation .p-tool svg { width: 14px; height: 14px; flex-shrink: 0; }

/* ---------- barra de rolagem automática (página da música) ---------- */
.scroll-bar {
  position: fixed; left: 12px; right: 12px; z-index: 60;
  bottom: calc(var(--bottom-h) + 12px);
  display: flex; align-items: center; gap: 8px;
  background: var(--green); color: #F7F4EE;
  border-radius: 16px; padding: 8px; box-shadow: var(--shadow-lift);
}
@media (min-width: 860px) {
  .scroll-bar { bottom: 20px; left: auto; right: 20px; width: auto; }
}
body.has-video-bar .scroll-bar { bottom: calc(var(--bottom-h) + 140px); }
@media (min-width: 860px) { body.has-video-bar .scroll-bar { bottom: 158px; } }
.scroll-bar .sb-main {
  flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: 11px; background: rgba(247,244,238,0.1); color: #F7F4EE;
  padding: 11px 14px; font-size: 13.5px; font-weight: 600; cursor: pointer; min-width: 118px;
}
.scroll-bar .sb-main svg { width: 16px; height: 16px; flex-shrink: 0; }
.scroll-bar .sb-main[data-active="true"] { background: var(--gold); color: #241d0c; }
.scroll-bar .sb-speed { display: inline-flex; align-items: center; border-radius: 11px; overflow: hidden; background: rgba(247,244,238,0.1); }
.scroll-bar .sb-speed button {
  border: none; background: transparent; color: #F7F4EE; padding: 11px 13px; font-size: 16px; cursor: pointer; line-height: 1;
}
.scroll-bar .sb-level { display: inline-flex; flex-direction: column; align-items: center; padding: 0 3px; min-width: 30px; }
.scroll-bar .sb-level strong { font-size: 13.5px; color: var(--gold); line-height: 1.1; }
.scroll-bar .sb-level small { font-size: 8.5px; opacity: .6; letter-spacing: .04em; }
.scroll-bar .sb-video {
  display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 11px;
  background: rgba(247,244,238,0.1); color: #F7F4EE; padding: 11px 13px; font-size: 12.5px; cursor: pointer;
}
.scroll-bar .sb-video svg { width: 15px; height: 15px; flex-shrink: 0; }

/* ---------- player do vídeo (fica fora do conteúdo que rola) ---------- */
.video-bar {
  position: fixed; left: 0; right: 0; z-index: 320;
  bottom: var(--bottom-h);
  background: #14201c; color: #F7F4EE; padding: 10px 12px;
  border-top: 1px solid rgba(247,244,238,0.15);
}
@media (min-width: 860px) { .video-bar { bottom: 0; } }
.video-bar .vb-row { display: flex; align-items: center; gap: 10px; }
.video-bar .vb-controls { margin-top: 9px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.video-bar .vb-controls::-webkit-scrollbar { display: none; }
.video-bar .vb-player { position: relative; width: 96px; height: 54px; flex-shrink: 0; background: #000; border-radius: 8px; overflow: hidden; }
.video-bar .vb-player iframe { width: 100%; height: 100%; border: 0; }
.video-bar .vb-loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; opacity: .6;
}
.video-bar .vb-main { flex: 1; min-width: 0; }
.video-bar .vb-warn {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(184,149,85,0.18); color: var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700;
}
.video-bar .vb-errmsg { font-size: 11.5px; line-height: 1.45; opacity: .8; margin-top: 3px; }
.video-bar a.vb-sync { text-decoration: none; }
.video-bar .vb-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.video-bar .vb-time { font-size: 11px; opacity: .7; font-variant-numeric: tabular-nums; }
.video-bar .vb-seek {
  -webkit-appearance: none; appearance: none; width: 100%; height: 18px;
  background: transparent; margin: 2px 0 0; cursor: pointer; display: block;
}
.video-bar .vb-seek::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(247,244,238,0.25); }
.video-bar .vb-seek::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(247,244,238,0.25); }
.video-bar .vb-seek::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%;
  background: var(--gold); margin-top: -4.5px; border: none;
}
.video-bar .vb-seek::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--gold); border: none; }
.video-bar .vb-play {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: none;
  background: var(--gold); color: #241d0c; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.video-bar .vb-play svg { width: 19px; height: 19px; }
.video-bar .vb-sync {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid rgba(247,244,238,0.3); background: transparent; color: #F7F4EE;
  border-radius: 11px; padding: 10px 13px; font-size: 12.5px; cursor: pointer; white-space: nowrap;
}
.video-bar .vb-sync svg { width: 14px; height: 14px; flex-shrink: 0; }
.video-bar .vb-sync[data-on="true"] { background: var(--gold); border-color: var(--gold); color: #241d0c; font-weight: 700; }
.video-bar .vb-offset { flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; opacity: .9; white-space: nowrap; }
.video-bar .vb-offset-label { opacity: .7; }
.video-bar .vb-offset button {
  border: 1px solid rgba(247,244,238,0.3); background: transparent; color: #F7F4EE;
  width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1;
}
.video-bar .vb-offset strong { color: var(--gold); min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }
.video-bar .vb-close {
  flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid rgba(247,244,238,0.25); background: transparent; color: #F7F4EE;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.video-bar .vb-close svg { width: 15px; height: 15px; }
/* no Modo Culto a barra do vídeo encosta no rodapé da tela cheia e os
   controles da apresentação sobem para não ficarem escondidos atrás dela */
.video-bar.in-presentation { bottom: 0; }
body.has-video-bar .presentation { padding-bottom: 132px; }

.toast {
  position: fixed; bottom: calc(var(--bottom-h) + 16px); left: 50%; transform: translateX(-50%);
  background: var(--green); color: #F7F4EE; padding: 11px 20px; border-radius: 999px; font-size: 13.5px;
  z-index: 400; box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
@media (min-width: 860px) { .toast { bottom: 26px; } }
.toast[data-show="true"] { opacity: 1; transform: translateX(-50%) translateY(-6px); }

.footer-note { text-align: center; color: var(--text-faint); font-size: 11.5px; margin-top: 40px; padding-bottom: 20px; }

/* espaço para as últimas linhas não ficarem escondidas atrás da barra */
.scroll-bar-spacer { height: 74px; }
body.has-video-bar .scroll-bar-spacer { height: 208px; }

@media print {
  header.site-header, nav.bottom-nav, .toolbar, .fab, .footer-note, .back-btn, .search-row,
  .scroll-bar, .scroll-bar-spacer, .video-bar, .detail-links, .hscroll-hint { display: none !important; }
  body { background: #fff; padding-bottom: 0; }
  .detail-content { border: none; box-shadow: none; padding: 0; }
}

/* ---------- logo e nome da comunidade ---------- */
.brand img.mark {
  width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
  background: var(--bg-soft); flex-shrink: 0;
}
.brand .brand-name { font-size: 19px; line-height: 1.15; }
@media (max-width: 520px) {
  .brand .brand-name { font-size: 15.5px; max-width: 190px; }
  .brand img.mark { width: 34px; height: 34px; }
}

/* ---------- menu "Mais" do rodapé ---------- */
nav.bottom-nav button {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border: none; background: none; color: var(--text-faint);
  font-size: 10.5px; font-weight: 600; cursor: pointer; font-family: inherit;
}
nav.bottom-nav button svg { width: 21px; height: 21px; }
nav.bottom-nav button[data-active="true"] { color: var(--green); }
nav.bottom-nav button[data-active="true"] svg { color: var(--gold); }
.menu-mais { display: flex; flex-direction: column; gap: 6px; }
.menu-mais button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: 1px solid var(--border); background: var(--card); border-radius: 12px;
  padding: 14px 16px; font-size: 15px; color: var(--text); cursor: pointer; font-family: inherit;
}
.menu-mais button:hover { border-color: var(--gold); }
.menu-mais button svg { width: 19px; height: 19px; color: var(--gold); flex-shrink: 0; }

/* ---------- Bíblia ---------- */
.bib-secao {
  font-family: var(--serif); font-size: 19px; color: var(--green);
  margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.livro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 8px; }
.livro-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  border: 1px solid var(--border); background: var(--card); border-radius: 11px;
  padding: 12px 13px; cursor: pointer; font-family: inherit; text-align: left;
}
.livro-btn:hover { border-color: var(--gold); }
.livro-nome { font-size: 14px; font-weight: 600; color: var(--text); }
.livro-caps { font-size: 11.5px; color: var(--text-faint); flex-shrink: 0; }
.cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-top: 6px; }
.cap-btn {
  aspect-ratio: 1; border: 1px solid var(--border); background: var(--card);
  border-radius: 11px; font-size: 15px; color: var(--text); cursor: pointer; font-family: inherit;
}
.cap-btn:hover { border-color: var(--gold); background: var(--bg-soft); }
.bib-titulo { font-family: var(--serif); font-size: 26px; color: var(--green); margin: 4px 0 14px; }
.bib-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.bib-passos { display: inline-flex; align-items: center; gap: 4px; }
.bib-passos span { font-family: var(--serif); font-size: 16px; color: var(--green); padding: 0 8px; }
.bib-passos button {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.bib-passos button svg { width: 16px; height: 16px; }
.bib-passos button:disabled { opacity: .35; cursor: not-allowed; }
.bib-texto .versiculo { margin: 0 0 11px; line-height: 1.75; font-size: 16px; }
.bib-texto .v-num {
  color: var(--gold); font-weight: 700; font-size: 12px; vertical-align: super;
  margin-right: 5px; font-family: var(--sans);
}
.verso-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 13px 15px; cursor: pointer;
}
.verso-card:hover { border-color: var(--gold); }
.verso-ref { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 5px; }
.verso-txt { font-size: 14.5px; line-height: 1.6; color: var(--text); }
.verso-txt mark { background: var(--gold-soft); color: var(--text); padding: 0 2px; border-radius: 3px; }

/* ---------- Agenda ---------- */
.agenda-card {
  display: flex; align-items: center; gap: 13px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 15px; cursor: pointer;
}
.agenda-card:hover { border-color: var(--gold); }
.ag-data {
  flex-shrink: 0; width: 48px; height: 52px; border-radius: 11px; background: var(--bg-soft);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ag-dia { font-family: var(--serif); font-size: 21px; font-weight: 700; color: var(--green); line-height: 1; }
.ag-mes { font-size: 10.5px; text-transform: uppercase; color: var(--text-faint); letter-spacing: .06em; }
.ag-info { flex: 1; min-width: 0; }
.ag-titulo { font-weight: 600; font-size: 15px; color: var(--text); }
.ag-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
.ag-obs { font-size: 12px; color: var(--text-faint); margin-top: 4px; }
.agenda-passados { opacity: .62; }
/* a etiqueta do tipo também aparece fora dos cartões do acervo */
.cat-tag { color: #fff; font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; flex-shrink: 0; }

</style>

{
"id": "oracao-da-manha-oracao",
"tipo": "oracao",

"categoria": "Manhã",
"subcategoria": "Manhã",
"page": null,
"content": "Senhor, eu te agradeço por este novo dia.\nObrigado por me acordar com vida e com saúde.\n\nColoco em tuas mãos os meus passos de hoje:\no meu trabalho, os meus encontros, as minhas decisões.\n\nQue eu enxergue as oportunidades de fazer o bem,\nque eu tenha paciência com quem cruzar meu caminho,\ne que a tua paz habite em mim do início ao fim deste dia.\n\nGuia-me, Senhor, e caminha comigo.\nAmém.",
"views": 0
},
{
"id": "ao-despertar-oracao",
"tipo": "oracao",
"title": "Ao Despertar",
"composer": "Tradicional",
"categoria": "Manhã",
"subcategoria": "Manhã",
"page": null,
"content": "Bendito sejas, Senhor, pela luz de mais uma manhã.\n\nAntes de qualquer palavra ou tarefa,\nquero começar o dia voltando meu coração para ti.\n\nRenova em mim a esperança,\nacalma qualquer ansiedade que eu traga do sono,\ne enche-me de disposição para servir com alegria.\n\nQue tudo o que eu fizer hoje seja para o teu louvor.\nAmém.",
"views": 0
},
{
"id": "oracao-da-noite-oracao",
"tipo": "oracao",
"title": "Oração da Noite",
"composer": "Tradicional",
"categoria": "Noite",
"subcategoria": "Noite",
"page": null,
"content": "Senhor, chega o fim de mais um dia.\n\nObrigado por tudo o que vivi:\npelas alegrias que me fizeste sorrir,\npelos desafios que me ensinaste a atravessar,\ne pela tua presença, mesmo quando eu não percebi.\n\nPerdoa-me onde falhei.\nAbençoa quem amo e quem cruzou meu caminho hoje.\n\nAgora entrego este dia em tuas mãos\ne descanso, sabendo que tu vigias sobre mim.\nAmém.",
"views": 0
},
{
"id": "antes-de-dormir-oracao",
"tipo": "oracao",
"title": "Antes de Dormir",
"composer": "Tradicional",
"categoria": "Noite",
"subcategoria": "Noite",
"page": null,
"content": "Pai, antes de fechar os olhos,\nquero fazer silêncio diante de ti.\n\nDevolvo-te as preocupações que carreguei hoje.\nSolto o que não consegui resolver\ne confio que amanhã terei forças renovadas.\n\nCuida do meu sono, cuida da minha casa,\ncuida de quem amo e está longe de mim agora.\n\nEm paz me deito e descanso,\nporque só tu, Senhor, me fazes viver seguro.\nAmém.",
"views": 0
},
{
"id": "ato-de-gratidao-oracao",
"tipo": "oracao",
"title": "Ato de Gratidão",
"composer": "Tradicional",
"categoria": "Gratidão",
"subcategoria": "Gratidão",
"page": null,
"content": "Senhor, hoje quero simplesmente dizer obrigado.\n\nObrigado pela vida, pela família, pelos amigos.\nObrigado pelo pão de cada dia e pelo teto que me abriga.\nObrigado pelas pessoas que me ajudaram a chegar até aqui.\nObrigado pelas dificuldades também,\nporque em cada uma delas aprendi a confiar mais em ti.\n\nQue eu nunca me esqueça de agradecer\nantes de pedir qualquer coisa nova.\n\nA ti, toda a glória e toda a gratidão do meu coração.\nAmém.",
"views": 0
},
{
"id": "pelas-bencaos-recebidas-oracao",
"tipo": "oracao",
"title": "Pelas Bênçãos Recebidas",
"composer": "Tradicional",
"categoria": "Gratidão",
"subcategoria": "Gratidão",
"page": null,
"content": "Pai bondoso, paro agora para contar as tuas bênçãos.\n\nCada vitória, cada porta que se abriu,\ncada oração respondida e cada momento de paz\nforam sinais do teu cuidado sobre mim.\n\nNão permitas que eu me acostume tanto com o bem\na ponto de deixar de te agradecer por ele.\n\nRecebe o louvor do meu coração agradecido.\nAmém.",
"views": 0
},
{
"id": "oracao-de-intercessao-oracao",
"tipo": "oracao",
"title": "Oração de Intercessão",
"composer": "Tradicional",
"categoria": "Intercessão",
"subcategoria": "Intercessão",
"page": null,
"content": "Senhor, hoje trago diante de ti aqueles que preciso apresentar a ti:\n\nos que estão doentes, para que sintam o teu alívio;\nos que estão tristes, para que encontrem consolo;\nos que estão perdidos, para que encontrem o caminho;\nos que estão sozinhos, para que sintam a tua companhia.\n\nEstende a tua mão sobre cada um deles\ne usa-me, se for da tua vontade,\ncomo instrumento de resposta a essas orações.\n\nPor todos eles, eu intercedo.\nAmém.",
"views": 0
},
{
"id": "pelos-que-sofrem-oracao",
"tipo": "oracao",
"title": "Pelos que Sofrem",
"composer": "Tradicional",
"categoria": "Intercessão",
"subcategoria": "Intercessão",
"page": null,
"content": "Senhor, olha com compaixão para quem sofre hoje.\n\nPor quem enfrenta a dor, física ou do coração,\npor quem perdeu alguém querido,\npor quem está em meio a uma batalha que eu nem conheço,\neu te peço: aproxima-te e conforta.\n\nQue ninguém precise sofrer sozinho,\ne que através de mim, se for possível,\nalguém sinta o teu amor concreto e presente.\nAmém.",
"views": 0
},
{
"id": "pela-familia-oracao",
"tipo": "oracao",
"title": "Pela Família",
"composer": "Tradicional",
"categoria": "Família",
"subcategoria": "Família",
"page": null,
"content": "Senhor, abençoa a minha família.\n\nFortalece os laços que nos unem,\ncura as feridas que ainda doem entre nós,\ne ensina-nos a nos perdoar com a mesma facilidade\ncom que tu perdoas a mim.\n\nQue a nossa casa seja lugar de paz, de escuta e de afeto.\nProtege cada um que mora sob o mesmo teto que eu,\ne também os que estão longe, mas continuam sendo minha família.\n\nUne-nos sempre em teu amor.\nAmém.",
"views": 0
},
{
"id": "pelos-filhos-oracao",
"tipo": "oracao",
"title": "Pelos Filhos",
"composer": "Tradicional",
"categoria": "Família",
"subcategoria": "Família",
"page": null,
"content": "Pai, coloco em tuas mãos aqueles que me foste confiado como filhos.\n\nGuia os passos deles quando eu não puder caminhar ao lado.\nProtege-os dos perigos que eu não posso ver.\nDá-me sabedoria para educar com amor e verdade,\ne paciência para os dias mais difíceis.\n\nQue eles cresçam conhecendo o teu amor\nantes mesmo de entenderem todas as palavras sobre ele.\nAmém.",
"views": 0
},
{
"id": "oracao-de-protecao-oracao",
"tipo": "oracao",
"title": "Oração de Proteção",

"categoria": "Proteção",
"subcategoria": "Proteção",
"page": null,
"content": "Senhor, sê o meu abrigo hoje.\n\nProtege-me dos perigos visíveis e dos que eu não consigo ver.\nGuarda a minha saúde, o meu trabalho, a minha família e a minha casa.\nAfasta de mim tudo o que pretende me fazer mal.\n\nQue eu caminhe com confiança,\nsabendo que estou debaixo da tua proteção\ne que nada pode me alcançar sem que passe primeiro por tuas mãos.\nAmém.",
"views": 0
},
{
"id": "em-momento-de-perigo-ou-medo-oracao",
"tipo": "oracao",
"title": "Em Momento de Perigo ou Medo",
"composer": "Tradicional",
"categoria": "Proteção",
"subcategoria": "Proteção",
"page": null,
"content": "Senhor, sinto medo, e venho a ti.\n\nAcalma o meu coração acelerado.\nLembra-me de que tu estás comigo mesmo agora.\nDá-me discernimento para agir com sabedoria\ne coragem para atravessar o que precisar ser atravessado.\n\nTu és a minha fortaleza; não temerei.\nAmém.",
"views": 0
},
{
"id": "oracao-de-abertura-do-culto-oracao",
"tipo": "oracao",
"title": "Oração de Abertura da Missa",
"composer": "Tradicional",
"categoria": "Missa",
"subcategoria": "Missa",
"page": null,
"content": "Senhor, estamos reunidos diante de ti.\n\nPrepara o nosso coração para este momento de louvor e escuta.\nSilencia em nós as distrações que trazemos de fora,\ne desperta em cada um o desejo sincero de te encontrar.\n\nQue a tua presença seja sentida aqui,\nque a tua Palavra toque quem precisa ser tocado,\ne que saiamos daqui diferentes de como entramos.\nVem, Senhor, e reina neste momento.\nAmém.",
"views": 0
},
{
"id": "oracao-de-encerramento-do-culto-oracao",
"tipo": "oracao",
"title": "Oração de Encerramento da Missa",
"composer": "Tradicional",
"categoria": "Missa",
"subcategoria": "Missa",
"page": null,
"content": "Senhor, obrigado por este tempo que passamos juntos em tua presença.\n\nQue a Palavra que ouvimos não fique só na mente,\nmas transforme a nossa maneira de viver esta semana.\nVai conosco quando sairmos daqui;\nque o que vivemos nesta missa continue vivo em nós.\n\nAbençoa a cada um que esteve presente,\ne a quem não pôde estar, mas está em nosso coração.\nQue a tua paz nos acompanhe até o nosso próximo encontro.\nAmém.",
"views": 0
},
{
"id": "pai-nosso-oracao",
"tipo": "oracao",
"title": "Pai Nosso",
"composer": "Mateus 6.9-13",
"categoria": "Missa",
"subcategoria": "Missa",
"page": null,
"content": "Pai nosso, que estás nos céus,\nsantificado seja o teu nome.\nVenha o teu reino.\nSeja feita a tua vontade,\nassim na terra como no céu.\n\nO pão nosso de cada dia nos dá hoje.\nE perdoa-nos as nossas dívidas,\nassim como nós também temos perdoado\naos nossos devedores.\n\nE não nos deixes cair em tentação,\nmas livra-nos do mal;\nporque teu é o reino, e o poder,\ne a glória, para sempre. Amém.",
