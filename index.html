    ${!isEdit ? `
      <div class="tabs">
        <button class="tab-btn" data-mtab="paste" data-active="${modalTab === 'paste'}">Colar cifra</button>
        <button class="tab-btn" data-mtab="form" data-active="${modalTab === 'form'}">Formulário</button>
      </div>` : ''}
    <div id="modal-tab-content"></div>
  `;
}
function pasteTabHtml() {
  return `
    <div class="paste-area">
      <div class="field">
        <label>Cole o texto do cântico (de qualquer site de cifras)</label>
        <textarea id="paste-input" placeholder="Cole aqui a cifra completa, com título e acordes..."></textarea>
        <div class="hint">O sistema tenta identificar o título e o autor automaticamente. Você poderá revisar antes de salvar.</div>
      </div>
      <button class="primary-btn" id="parse-btn">Analisar texto</button>
    </div>
  `;
}
function autoParse(raw) {
  const lines = raw.replace(/\r\n/g, '\n').split('\n');
  while (lines.length && lines[0].trim() === '') lines.shift();
  while (lines.length && lines[lines.length - 1].trim() === '') lines.pop();
  if (lines.length === 0) return { title: '', composer: '', content: '' };
  let title = lines[0].trim().replace(/^\[.*?\]\s*/, '').trim();
  let idx = 1, composer = '';
  if (idx < lines.length) {
    const l = lines[idx].trim();
    const m = l.match(/^(artista|int[eé]rprete|composi[cç][aã]o|compositor|autor)\s*:\s*(.+)$/i);
    if (m) { composer = m[2].trim(); idx++; }
    else if (l !== '' && l.length < 50 && !/[|]/.test(l) && !isChordLine(l)) { composer = l; idx++; }
  }
  while (idx < lines.length && lines[idx].trim() === '') idx++;
  return { title, composer, content: lines.slice(idx).join('\n').trim() };
}
function formTabHtml(item) {
  item = item || { title: '', composer: '', tipo: modalDefaultTipo, categoria: '', page: '', content: '', videoUrl: '', pdfData: '', pdfName: '' };
  const cats = item.tipo === 'oracao' ? ORACAO_CATEGORIES : CANTICO_CATEGORIES;
  return `
    <div class="field">
      <label>Tipo</label>
      <select id="f-tipo">
        <option value="cantico" ${item.tipo === 'cantico' ? 'selected' : ''}>Cântico / Música</option>
        <option value="oracao" ${item.tipo === 'oracao' ? 'selected' : ''}>Oração</option>
      </select>
    </div>
    <div class="field"><label>Título</label><input type="text" id="f-title" value="${escapeHtml(item.title)}" placeholder="Nome do cântico ou da oração" /></div>
    <div class="field"><label>Autor / Compositor</label><input type="text" id="f-composer" value="${escapeHtml(item.composer)}" placeholder="Ex: Shalom, Frei Gilson..." /></div>
    <div class="field">
      <label>Categoria</label>
      <select id="f-categoria">
        <option value="">Selecionar...</option>
        ${cats.map(c => `<option value="${escapeHtml(c)}" ${item.categoria === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Página na apostila (opcional)</label><input type="text" id="f-page" value="${item.page || ''}" placeholder="Ex: 128" /></div>
    <div class="field">
      <label id="f-content-label">Letra e cifra</label>
      <textarea id="f-content" style="min-height:220px">${escapeHtml(item.content)}</textarea>
      <div class="hint">Para cânticos, mantenha os acordes na linha de cima, alinhados com espaços, para a cifra ficar legível.</div>
    </div>
    <div class="field">
      <label>Link do vídeo (opcional)</label>
      <input type="text" id="f-video" value="${escapeHtml(item.videoUrl || '')}" placeholder="Cole o link do YouTube ou de outro vídeo" />
      <div class="hint">Se deixar em branco, o app gera automaticamente um link de busca no YouTube.</div>
    </div>
    <div class="field">
      <label>PDF da música (opcional)</label>
      <input type="file" id="f-pdf" accept="application/pdf" />
      <div class="hint" id="f-pdf-status">${item.pdfName ? `PDF atual: ${escapeHtml(item.pdfName)} — escolha outro arquivo para substituir.` : 'Anexe o PDF original da música, se tiver.'}</div>
    </div>
    <button class="primary-btn" id="save-btn">${item.id ? 'Salvar alterações' : 'Salvar no acervo'}</button>
    ${item.id ? '<button class="secondary-btn" id="cancel-btn">Cancelar</button>' : ''}
  `;
}
function bindModalEvents(existing) {
  document.getElementById('modal-close').addEventListener('click', closeModal);
  const tabBtns = document.querySelectorAll('.tab-btn');
  tabBtns.forEach(el => el.addEventListener('click', () => { modalTab = el.dataset.mtab; switchModalTab(existing); }));
  switchModalTab(existing);
}
function switchModalTab(existing) {
  document.querySelectorAll('.tab-btn').forEach(el => { el.dataset.active = (el.dataset.mtab === modalTab); });
  const content = document.getElementById('modal-tab-content');
  if (!existing && modalTab === 'paste') {
    content.innerHTML = pasteTabHtml();
    document.getElementById('parse-btn').addEventListener('click', () => {
      const raw = document.getElementById('paste-input').value;
      if (!raw.trim()) { showToast('Cole o texto primeiro.'); return; }
      const parsed = autoParse(raw);
      content.innerHTML = `<div class="parse-preview">Identifiquei <strong>${escapeHtml(parsed.title || '(sem título)')}</strong>${parsed.composer ? ' · ' + escapeHtml(parsed.composer) : ''}. Revise os campos antes de salvar.</div>${formTabHtml({ title: parsed.title, composer: parsed.composer, tipo: 'cantico', categoria: '', page: '', content: parsed.content })}`;
      bindFormSave(null);
    });
  } else {
    content.innerHTML = formTabHtml(existing);
    bindFormSave(existing);
    if (existing) {
      const tipoSel = document.getElementById('f-tipo');
      tipoSel.disabled = true;
    }
  }
}
function bindFormSave(existing) {
  const tipoSel = document.getElementById('f-tipo');
  tipoSel.addEventListener('change', () => {
    const cats = tipoSel.value === 'oracao' ? ORACAO_CATEGORIES : CANTICO_CATEGORIES;
    document.getElementById('f-categoria').innerHTML = `<option value="">Selecionar...</option>` + cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  });
  document.getElementById('save-btn').addEventListener('click', async () => {
    const title = document.getElementById('f-title').value.trim();
    const composer = document.getElementById('f-composer').value.trim();
    const tipo = document.getElementById('f-tipo').value;
    const categoria = document.getElementById('f-categoria').value || 'Outros';
    const page = document.getElementById('f-page').value.trim();
    const contentVal = document.getElementById('f-content').value;
    const videoUrl = document.getElementById('f-video').value.trim();
    if (!title) { showToast('Informe o título.'); return; }
    if (!contentVal.trim()) { showToast('Informe o conteúdo.'); return; }

    const saveBtn = document.getElementById('save-btn');
    const targetId = existing && existing.id ? existing.id : slugify(title, Date.now().toString(36));
    let pdfName = existing ? existing.pdfName : undefined;
    let hasPdfFlag = existing ? existing.hasPdf : undefined;
    const pdfFile = document.getElementById('f-pdf').files[0];
    if (pdfFile) {
      saveBtn.textContent = 'Salvando PDF...';
      saveBtn.disabled = true;
      try { await savePdf(targetId, pdfFile); pdfName = pdfFile.name; hasPdfFlag = true; }
      catch (e) {
        showToast('Não consegui salvar o PDF neste aparelho.');
        saveBtn.disabled = false; saveBtn.textContent = 'Salvar';
        return;
      }
    }

    const extra = { videoUrl: videoUrl || undefined, pdfName, hasPdf: hasPdfFlag };
    if (existing && existing.id) {
      if (existing.mine) {
        saveUserItems(loadUserItems().map(x => x.id === existing.id ? { ...x, title, composer, categoria, subcategoria: categoria, page, content: contentVal, ...extra } : x));
      } else {
        const edits = loadEdits();
        edits[existing.id] = { ...(edits[existing.id] || {}), title, composer, categoria, subcategoria: categoria, page, content: contentVal, ...extra };
        saveEdits(edits);
      }
      showToast('Alterações salvas.');
    } else {
      const list = loadUserItems();
      list.push({ id: targetId, tipo, title, composer, categoria, subcategoria: categoria, page, content: contentVal, views: 0, ...extra });
      try { saveUserItems(list); }
      catch (e) { showToast('Não foi possível salvar (armazenamento cheio).'); saveBtn.disabled = false; return; }
      showToast(tipo === 'oracao' ? 'Oração adicionada!' : 'Música adicionada!');
    }
    closeModal();
    render();
  });
  const cancelBtn = document.getElementById('cancel-btn');
  if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
}

// ---------- MAIN RENDER ----------
let lastRouteKey = null;
function render() {
  const { path, params } = currentRoute();
  const clean = path.split('?')[0];
  // Só ao MUDAR de tela paramos a rolagem, fechamos o vídeo e voltamos ao
  // topo. Assim favoritar ou mudar a fonte no meio de uma música não
  // interrompe a rolagem nem a reprodução.
  // endereços antigos (#/modo-culto, #/sermoes) seguem funcionando
  const ROUTE_ALIAS = { 'modo-culto': 'modo-missa', 'modo-culto/apresentacao': 'modo-missa/apresentacao', 'sermoes': 'palavra' };
  if (ROUTE_ALIAS[clean]) { navTo(ROUTE_ALIAS[clean]); return; }

  const routeChanged = clean !== lastRouteKey;
  if (routeChanged) {
    stopAutoScroll(true);
    const openId = clean.startsWith('item/') ? clean.slice(5) : null;
    // o vídeo só continua tocando se seguirmos na música dele
    if (videoState.itemId && videoState.itemId !== openId && clean !== 'modo-missa/apresentacao') destroyVideoBar();
  }
  lastRouteKey = clean;

  renderShell();
  const root = document.getElementById('app');

  if (clean === '') { root.innerHTML = pageHome(); bindHome(); }
  else if (clean === 'busca') { root.innerHTML = pageBusca(params); bindBusca(); }
  else if (clean === 'acervo') { root.innerHTML = pageAcervo(); bindAcervo(); }
  else if (clean === 'oracoes') { root.innerHTML = pageOracoes(); bindOracoes(); }
  else if (clean === 'palavra') { root.innerHTML = pageSermoes(); bindSermoes(); }
  else if (clean === 'biblia') { root.innerHTML = pageBiblia(); bindBiblia(); }
  else if (clean === 'agenda') { root.innerHTML = pageAgenda(); bindAgenda(); }
  else if (clean === 'favoritos') { root.innerHTML = pageFavoritos(); bindFavoritos(); }
  else if (clean === 'modo-missa') { root.innerHTML = pageModoCulto(); bindModoCulto(); }
  else if (clean === 'modo-missa/apresentacao') { root.innerHTML = pagePresentation(); if (document.querySelector('.presentation')) bindPresentation(); }
  else if (clean === 'admin') { root.innerHTML = pageAdmin(); bindAdmin(); }
  else if (clean.startsWith('item/')) { const id = clean.slice(5); root.innerHTML = pageDetail(id); bindDetail(id); }
  else { root.innerHTML = pageHome(); bindHome(); }

  if (routeChanged) window.scrollTo(0, 0);
}

function init() {
  const savedTheme = localStorage.getItem(LS_THEME);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  render();
  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { refreshDetailFont(); refreshPresentationFont(); }, 120);
  });
}
document.addEventListener('DOMContentLoaded', init);

</script>
