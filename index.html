// ---------- storage helpers ----------
function lsGet(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; } catch (e) { return fallback; } }
function lsSet(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function loadFavorites() { return new Set(lsGet(LS_FAV, [])); }
function saveFavorites(set) { lsSet(LS_FAV, [...set]); }
function loadUserItems() { return lsGet(LS_USER_ITEMS, []); }
function saveUserItems(list) { lsSet(LS_USER_ITEMS, list); }
function loadEdits() { return lsGet(LS_EDITS, {}); }
function saveEdits(obj) { lsSet(LS_EDITS, obj); }
function loadDeleted() { return lsGet(LS_DELETED, []); }
function saveDeleted(list) { lsSet(LS_DELETED, list); }
function loadViews() { return lsGet(LS_VIEWS, {}); }
function saveViews(obj) { lsSet(LS_VIEWS, obj); }
function loadSetlist() { return lsGet(LS_SETLIST, []); }
function saveSetlist(list) { lsSet(LS_SETLIST, list); }

// ---------- playlists (Modo Missa) ----------
// Várias listas nomeadas e salvas, não apenas "a lista de hoje".
function loadPlaylists() {
  let pls = lsGet(LS_PLAYLISTS, null);
  if (!pls || !Array.isArray(pls) || pls.length === 0) {
    const legacy = loadSetlist(); // migra a lista única antiga, se existir
    pls = [{ id: 'default-' + Date.now().toString(36), name: 'Missa de hoje', items: legacy || [] }];
    savePlaylists(pls);
  }
  return pls;
}
function savePlaylists(list) { lsSet(LS_PLAYLISTS, list); }
function getActivePlaylistId() {
  const pls = loadPlaylists();
  let id = localStorage.getItem(LS_ACTIVE_PLAYLIST);
  if (!id || !pls.find(p => p.id === id)) id = pls[0].id;
  return id;
}
function setActivePlaylistId(id) { localStorage.setItem(LS_ACTIVE_PLAYLIST, id); }
function getActivePlaylist() {
  const pls = loadPlaylists();
  return pls.find(p => p.id === getActivePlaylistId()) || pls[0];
}
function saveActivePlaylistItems(items) {
  const pls = loadPlaylists();
  const idx = pls.findIndex(p => p.id === getActivePlaylistId());
  if (idx >= 0) { pls[idx].items = items; savePlaylists(pls); }
}
function addToActivePlaylist(id) {
  const pl = getActivePlaylist();
  if (!pl.items.includes(id)) { saveActivePlaylistItems([...pl.items, id]); return true; }
  return false;
}
function createPlaylist(name) {
  const pls = loadPlaylists();
  const id = 'pl-' + Date.now().toString(36);
  pls.push({ id, name: name.trim() || 'Nova playlist', items: [] });
  savePlaylists(pls);
  setActivePlaylistId(id);
}
function renamePlaylist(id, name) {
  const pls = loadPlaylists();
  const pl = pls.find(p => p.id === id);
  if (pl && name.trim()) { pl.name = name.trim(); savePlaylists(pls); }
}
function deletePlaylist(id) {
  let pls = loadPlaylists().filter(p => p.id !== id);
  if (pls.length === 0) pls = [{ id: 'default-' + Date.now().toString(36), name: 'Missa de hoje', items: [] }];
  savePlaylists(pls);
  if (getActivePlaylistId() === id) setActivePlaylistId(pls[0].id);
}

// ---------- PDFs anexados (IndexedDB) ----------
// Ficavam no localStorage em base64, que estoura com ~5MB no total. No
// IndexedDB o arquivo vai como blob e cabem centenas de MB.
const IDB_NAME = 'acervo_arquivos';
const IDB_STORE = 'pdfs';
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('sem indexeddb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbRun(mode, fn) {
  return idbOpen().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
}
function savePdf(id, file) { return idbRun('readwrite', st => st.put(file, id)); }
function loadPdf(id) { return idbRun('readonly', st => st.get(id)); }
function deletePdf(id) { return idbRun('readwrite', st => st.delete(id)).catch(() => {}); }
// Entrega o PDF ao usuário, seja do IndexedDB ou de um item antigo em base64.
function downloadPdf(item) {
  const fileName = item.pdfName || (item.title + '.pdf');
  const trigger = href => {
    const a = document.createElement('a');
    a.href = href; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
  };
  if (item.pdfData) { trigger(item.pdfData); return; }
  loadPdf(item.id).then(blob => {
    if (!blob) { showToast('PDF não encontrado neste aparelho.'); return; }
    const url = URL.createObjectURL(blob);
    trigger(url);
    setTimeout(() => URL.revokeObjectURL(url), 20000);
  }).catch(() => showToast('Não consegui abrir o PDF.'));
}
function hasPdf(item) { return !!(item.hasPdf || item.pdfData); }

function getAllItems() {
  const edits = loadEdits();
  const deleted = new Set(loadDeleted());
  const extraViews = loadViews();
  const base = LIBRARY_DATA
    .filter(s => !deleted.has(s.id) && !isHiddenByDevocao(s))
    .map(s => {
      const merged = edits[s.id] ? { ...s, ...edits[s.id], edited: true } : { ...s };
      merged.views = (merged.views || 0) + (extraViews[s.id] || 0);
      merged.mine = false;
      return merged;
    });
  const user = loadUserItems().map(s => ({ ...s, views: (s.views || 0) + (extraViews[s.id] || 0), mine: true }));
  return [...base, ...user];
}
function findItem(id) { return getAllItems().find(s => s.id === id); }
function registerView(id) {
  const v = loadViews();
  v[id] = (v[id] || 0) + 1;
  saveViews(v);
}

function slugify(title, extra) {
  const n = (title || 'item').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  return `${n.slice(0, 40)}-${extra}`;
}
function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
}
function articleStrip(t) { return norm(t).replace(/^(a|as|o|os)\s+/, ''); }
function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.dataset.show = 'true';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.dataset.show = 'false'; }, 2200);
}

// chord-line detection (for "esconder cifra" toggle + presentation mode)
const QUAL = '(maj7|maj9|maj13|maj|m7b5|m9|m7|m6|m11|m13|madd\\d+|m|M7|M9|M13|M|dim7|dim|sus4|sus2|sus|add\\d+|4|2|6|7|9|11|13|\\+|°|º)';
const ROOT = '[A-G](#|b)?';
const TOKEN_RE = new RegExp(`^\\(?${ROOT}${QUAL}*(\\(\\S{1,7}\\))?(/${ROOT}${QUAL}*)?\\)?[.,]?$`);
function isChordishToken(tok) {
  tok = tok.trim();
  if (tok === '') return true;
  if (/^\(?\d+x\)?$/.test(tok)) return true;
  if (tok === '|' || tok === '%') return true;
  return TOKEN_RE.test(tok);
}
function isChordLine(line) {
  const toks = line.trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return false;
  return toks.every(isChordishToken);
}
function renderContentHtml(content) {
  return content.split('\n').map(line => {
    const cls = isChordLine(line) ? ' class="chord-line"' : '';
    return `<span${cls}>${escapeHtml(line) || ' '}</span>`;
  }).join('\n');
}

// ---------- diagramas de cifra (desenhos de braço do violão) ----------
// Gera o "desenho" do acorde (como aquelas legendas de posição no topo da
// música na apostila impressa) a partir do próprio nome do acorde, sem
// precisar de nenhuma imagem: acordes conhecidos usam a digitação aberta
// padrão; os demais usam a pestana (E-shape) transposta para o tom certo.
const CHORD_OPEN_SHAPES = {
  E: [0, 2, 2, 1, 0, 0], Em: [0, 2, 2, 0, 0, 0], E7: [0, 2, 0, 1, 0, 0], Em7: [0, 2, 0, 0, 0, 0],
  A: [-1, 0, 2, 2, 2, 0], Am: [-1, 0, 2, 2, 1, 0], A7: [-1, 0, 2, 0, 2, 0], Am7: [-1, 0, 2, 0, 1, 0],
  D: [-1, -1, 0, 2, 3, 2], Dm: [-1, -1, 0, 2, 3, 1], D7: [-1, -1, 0, 2, 1, 2], Dm7: [-1, -1, 0, 2, 1, 1],
  G: [3, 2, 0, 0, 0, 3], G7: [3, 2, 0, 0, 0, 1],
  C: [-1, 3, 2, 0, 1, 0], C7: [-1, 3, 2, 3, 1, 0],
  B7: [-1, 2, 1, 2, 0, 2],
};
const CHORD_NOTE_IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
const CHORD_BARRE_PATTERNS = {
  '': f => [f, f + 2, f + 2, f + 1, f, f],
  m: f => [f, f + 2, f + 2, f, f, f],
  '7': f => [f, f + 2, f, f + 1, f, f],
  m7: f => [f, f + 2, f, f, f, f],
  maj7: f => [f, f + 2, f + 1, f + 1, f, f],
  sus4: f => [f, f + 2, f + 2, f + 2, f, f],
  sus2: f => [f, f + 2, f + 2, f + 2, f, f],
};
function parseChordName(raw) {
  const m = raw.trim().match(/^\(?([A-G](?:#|b)?)([^/()]*)(?:\/([A-G](?:#|b)?))?\)?[.,]?$/);
  if (!m || !(m[1] in CHORD_NOTE_IDX)) return null;
  return { root: m[1], qual: m[2] || '', bass: m[3] || null };
}
function chordQualityKey(q) {
  if (/^(maj7|maj9|M7|M9|M13)/.test(q)) return 'maj7';
  if (/^(m7b5|dim7|dim|°|º|m7|m9|m11|m13)/.test(q)) return 'm7';
  if (/^(m6|m|madd)/.test(q)) return 'm';
  if (/^(sus4|4)/.test(q)) return 'sus4';
  if (/^(sus2|2)/.test(q)) return 'sus2';
  if (/^(7|9|11|13|\+)/.test(q)) return '7';
  return '';
}
function chordShape(rawName) {
  const parsed = parseChordName(rawName);
  if (!parsed) return null;
  const qk = chordQualityKey(parsed.qual);
  const openKey = parsed.root + (qk === 'sus4' || qk === 'sus2' || qk === 'maj7' ? '' : qk);
  if (CHORD_OPEN_SHAPES[openKey]) return { frets: CHORD_OPEN_SHAPES[openKey] };
  const f = ((CHORD_NOTE_IDX[parsed.root] - CHORD_NOTE_IDX.E) % 12 + 12) % 12;
  const pattern = CHORD_BARRE_PATTERNS[qk] || CHORD_BARRE_PATTERNS[''];
  return { frets: pattern(f) };
}
function chordDiagramSvg(name) {
  const shape = chordShape(name);
  if (!shape) return '';
  const frets = shape.frets;
  const fretted = frets.filter(f => f > 0);
  const minFret = fretted.length ? Math.min(...fretted) : 0;
  const baseFret = minFret > 1 ? minFret : 1;
  const numFrets = 4;
  const left = 12, right = 72, top = 26;
  const stringGap = (right - left) / 5, fretGap = 58 / numFrets;
  let barreCount = 0;
  if (minFret > 0) { for (let i = 0; i < 6; i++) { if (frets[i] === minFret) barreCount++; else break; } }
  let svg = `<svg class="chord-diagram" viewBox="0 0 84 112" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<text x="42" y="13" text-anchor="middle" class="cd-name">${escapeHtml(name)}</text>`;
  if (baseFret === 1) svg += `<rect x="${left - 1}" y="${top - 2.5}" width="${right - left + 2}" height="3" class="cd-nut"/>`;
  else svg += `<text x="${left - 6}" y="${top + 9}" text-anchor="end" class="cd-fretnum">${baseFret}</text>`;
  for (let i = 0; i <= numFrets; i++) { const y = top + i * fretGap; svg += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" class="cd-fretline"/>`; }
  for (let i = 0; i < 6; i++) { const x = left + i * stringGap; svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${top + numFrets * fretGap}" class="cd-stringline"/>`; }
  if (barreCount >= 3) {
    const y = top + (minFret - baseFret + 0.5) * fretGap;
    svg += `<line x1="${left}" y1="${y}" x2="${left + (barreCount - 1) * stringGap}" y2="${y}" class="cd-barre"/>`;
  }
  frets.forEach((f, i) => {
    const x = left + i * stringGap;
    if (f === -1) svg += `<text x="${x}" y="${top - 6}" text-anchor="middle" class="cd-mute">×</text>`;
    else if (f === 0) svg += `<circle cx="${x}" cy="${top - 7}" r="3.2" class="cd-open"/>`;
    else if (!(barreCount >= 3 && i < barreCount && f === minFret)) {
      const y = top + (f - baseFret + 0.5) * fretGap;
      svg += `<circle cx="${x}" cy="${y}" r="4.4" class="cd-dot"/>`;
    }
  });
  svg += `</svg>`;
  return svg;
}
// Extrai, em ordem de primeira aparição, os acordes usados numa cifra.
function extractChords(content) {
  const seen = new Set(), out = [];
  content.split('\n').forEach(line => {
    if (!isChordLine(line)) return;
    line.trim().split(/\s+/).filter(Boolean).forEach(tok => {
      const t = tok.trim();
      if (!t || t === '|' || t === '%' || /^\(?\d+x\)?$/.test(t)) return;
      if (!parseChordName(t)) return;
      if (!seen.has(t)) { seen.add(t); out.push(t); }
    });
  });
  return out.slice(0, 12);
}
function chordLegendHtml(content) {
  const chords = extractChords(content);
  if (!chords.length) return '';
  return `<div class="chord-legend"><div class="chord-legend-row">${chords.map(c => chordDiagramSvg(c)).join('')}</div></div>`;
}

// Ajusta o tamanho da fonte de um <pre> de cifra para que a linha mais
// longa caiba na largura disponível, evitando texto cortado no celular.
// Usado apenas quando os acordes estão visíveis (o alinhamento coluna a
// coluna exige que tudo fique numa única linha); com "somente letra" o
// texto simplesmente quebra (ver CSS .chords-hidden).
function autoFitPre(preEl, opts) {
  if (!preEl) return;
  opts = opts || {};
  const min = opts.min || 11;
  const max = opts.max || 17;
  const lines = preEl.textContent.split('\n');
  const longest = lines.reduce((a, b) => (b.length > a.length ? b : a), '');
  if (!longest.trim()) return;
  const container = preEl.closest('.detail-content, .p-body');
  if (!container) return;
  const style = getComputedStyle(container);
  const padding = parseFloat(style.paddingLeft || 0) + parseFloat(style.paddingRight || 0);
  const availWidth = container.clientWidth - padding - 4;
  if (availWidth <= 0) return;
  const canvas = autoFitPre._canvas || (autoFitPre._canvas = document.createElement('canvas'));
  const ctx = canvas.getContext('2d');
  const probeSize = 100;
  ctx.font = `${probeSize}px ${getComputedStyle(preEl).fontFamily}`;
  const widthAtProbe = ctx.measureText(longest).width || 1;
  let size = Math.floor((availWidth / widthAtProbe) * probeSize);
  size = Math.max(min, Math.min(max, size));
  preEl.style.fontSize = size + 'px';
  preEl.dataset.autoFit = 'true';
  // aviso sutil de rolagem lateral quando, mesmo no tamanho mínimo, não coube tudo
  const wrap = preEl.closest('.detail-content, .p-body');
  if (wrap) wrap.classList.toggle('has-hscroll', preEl.scrollWidth > availWidth + 2);
}

/* =========================================================
   ROLAGEM AUTOMÁTICA (teleprompter) + SINCRONIA COM O VÍDEO
   Karaokê palavra a palavra exigiria marcar o tempo de cada
   verso; aqui a letra desce em ritmo constante, com velocidade
   ajustável e memorizada por música. Quando a música tem um
   link de vídeo do YouTube salvo, a rolagem passa a seguir o
   tempo real do vídeo (começa, pausa e termina junto com ele).
   ========================================================= */
const SCROLL_SPEEDS = [4, 7, 10, 14, 19, 25, 33, 43, 56, 72]; // px/s por nível 1..10
const scrollState = { raf: null, running: false, level: 4, pos: 0, itemId: null };

function loadScrollLevels() { return lsGet(LS_SCROLL, {}); }
function getScrollLevel(id) { const m = loadScrollLevels(); return m[id] != null ? m[id] : 4; }
function setScrollLevel(id, lvl) { const m = loadScrollLevels(); m[id] = lvl; lsSet(LS_SCROLL, m); }
function getVideoOffset(id) { const m = lsGet(LS_VIDEO_OFFSET, {}); return m[id] || 0; }
function setVideoOffset(id, v) { const m = lsGet(LS_VIDEO_OFFSET, {}); m[id] = v; lsSet(LS_VIDEO_OFFSET, m); }

// No modo missa quem rola é o painel; nas demais telas, a própria página.
function scrollTargetEl() {
  return document.querySelector('.presentation .p-body') || document.scrollingElement || document.documentElement;
}
function maxScrollOf(el) { return Math.max(0, el.scrollHeight - el.clientHeight); }

function startAutoScroll() {
  stopAutoScroll(true);
  scrollState.running = true;
  scrollState.pos = scrollTargetEl().scrollTop;
  let last = performance.now();
  const step = now => {
    if (!scrollState.running) return;
    // resolvido a cada quadro: ao trocar de música no Modo Missa o painel
    // que rola é recriado, e o elemento antigo deixaria a rolagem parada
    const el = scrollTargetEl();
    const dt = Math.min(0.12, (now - last) / 1000);
    last = now;
    // se o usuário arrastou a tela, continua a partir de onde ele parou
    if (Math.abs(el.scrollTop - scrollState.pos) > 3) scrollState.pos = el.scrollTop;
    scrollState.pos += (SCROLL_SPEEDS[scrollState.level - 1] || 14) * dt;
    const max = maxScrollOf(el);
    if (scrollState.pos >= max) { el.scrollTop = max; stopAutoScroll(); return; }
    el.scrollTop = scrollState.pos;
    scrollState.raf = requestAnimationFrame(step);
  };
  scrollState.raf = requestAnimationFrame(step);
  updateScrollUi();
}
function stopAutoScroll(silent) {
  if (scrollState.raf) cancelAnimationFrame(scrollState.raf);
  scrollState.raf = null;
  scrollState.running = false;
  if (!silent) updateScrollUi();
}
function toggleAutoScroll() {
  if (scrollState.running) stopAutoScroll();
  else startAutoScroll();
}
function changeScrollLevel(delta) {
  scrollState.level = Math.max(1, Math.min(10, scrollState.level + delta));
  if (scrollState.itemId) setScrollLevel(scrollState.itemId, scrollState.level);
  updateScrollUi();
}
function updateScrollUi() {
  const on = scrollState.running;
  document.querySelectorAll('[data-scroll-toggle]').forEach(btn => {
    btn.dataset.active = String(on);
    btn.innerHTML = `${icon(on ? 'pause' : 'scroll')}<span>${on ? 'Pausar' : 'Rolagem'}</span>`;
  });
  document.querySelectorAll('[data-scroll-level]').forEach(el => { el.textContent = scrollState.level; });
}
// Prepara a rolagem para o item aberto (recupera a velocidade salva dele).
function initScrollFor(itemId) {
  scrollState.itemId = itemId;
  scrollState.level = getScrollLevel(itemId);
  updateScrollUi();
}

// ---------- vídeo do YouTube ----------
function youtubeId(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
let ytApiPromise = null;
function loadYouTubeApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (typeof prev === 'function') prev(); resolve(window.YT); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => reject(new Error('sem-rede'));
    document.head.appendChild(tag);
    setTimeout(() => reject(new Error('tempo-esgotado')), 12000);
  });
  return ytApiPromise;
}

// Player com controles próprios (tocar/pausar, barra de progresso e modo
// "Auto sync"). Vive fora de #app para sobreviver às re-renderizações da
// página: favoritar ou mudar a fonte não interrompe a música.
const videoState = { player: null, itemId: null, raf: null, sync: true, seeking: false, playing: false, ready: false };

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}
function stopVideoLoop() { if (videoState.raf) cancelAnimationFrame(videoState.raf); videoState.raf = null; }
function destroyVideoBar() {
  stopVideoLoop();
  try { if (videoState.player && videoState.player.destroy) videoState.player.destroy(); } catch (e) { /* noop */ }
  videoState.player = null;
  videoState.itemId = null;
  videoState.playing = false;
  videoState.ready = false;
  const bar = document.getElementById('video-bar');
  if (bar) bar.remove();
  document.body.classList.remove('has-video-bar');
}
function videoPlayer() {
  const p = videoState.player;
  return p && typeof p.getCurrentTime === 'function' ? p : null;
}
function toggleVideoPlay() {
  const p = videoPlayer();
  if (!p) return;
  if (videoState.playing) p.pauseVideo(); else p.playVideo();
}
function toggleVideoSync() {
  videoState.sync = !videoState.sync;
  if (videoState.sync) stopAutoScroll(true); // as duas rolagens brigariam
  updateVideoUi();
  showToast(videoState.sync ? 'Auto sync ligado: a letra acompanha o vídeo.' : 'Auto sync desligado.');
}
function updateVideoUi() {
  const playBtn = document.getElementById('vb-play');
  if (playBtn) {
    playBtn.innerHTML = icon(videoState.playing ? 'pause' : 'play');
    playBtn.title = videoState.playing ? 'Pausar' : 'Tocar';
  }
  const syncBtn = document.getElementById('vb-sync');
  if (syncBtn) syncBtn.dataset.on = String(videoState.sync);
  document.querySelectorAll('[data-video-offset]').forEach(el => {
    el.textContent = (videoState.itemId ? getVideoOffset(videoState.itemId) : 0) + 's';
  });
}
// Um único laço cuida do relógio, da barra de progresso e da sincronia.
function videoLoop() {
  const p = videoPlayer();
  if (p) {
    const dur = p.getDuration ? (p.getDuration() || 0) : 0;
    const t = p.getCurrentTime() || 0;
    const timeEl = document.getElementById('vb-time');
    if (timeEl) timeEl.textContent = `${fmtTime(t)} / ${fmtTime(dur)}`;
    const seek = document.getElementById('vb-seek');
    if (seek && !videoState.seeking && dur > 0) seek.value = String(Math.round((t / dur) * 1000));
    if (videoState.sync && videoState.playing && dur > 0) {
      // desconta a introdução (offset) e alguns segundos finais, para a letra
      // terminar junto com o canto e não com os créditos do vídeo
      const el = scrollTargetEl();
      const off = getVideoOffset(videoState.itemId);
      const span = Math.max(1, dur - off - 3);
      const frac = Math.min(1, Math.max(0, (t - off) / span));
      el.scrollTop = frac * maxScrollOf(el);
    }
  }
  videoState.raf = requestAnimationFrame(videoLoop);
}
// O YouTube recusa o player embutido em algumas situações. As mensagens
// abaixo explicam cada caso em vez de deixar na tela um "Erro 153" cru.
function ytErrorInfo(code) {
  if (code === 101 || code === 150) {
    return { msg: 'O dono deste vídeo não permite tocá-lo fora do YouTube.',
             fix: 'Abra no YouTube, ou fixe o link de outra versão da música.' };
  }
  if (code === 100) {
    return { msg: 'Vídeo não encontrado. Pode ter sido removido ou estar privado.',
             fix: 'Fixe outro link para esta música.' };
  }
  if (code === 2) {
    return { msg: 'O link do vídeo parece inválido.', fix: 'Confira o endereço em "Fixar link".' };
  }
  if (code === 153 || location.protocol === 'file:') {
    return { msg: 'O YouTube bloqueia o player quando o app é aberto direto como arquivo no computador.',
             fix: 'Publique o app e abra pelo endereço do site: aí o vídeo toca aqui dentro, com o Auto sync. A rolagem manual funciona normalmente mesmo assim.' };
  }
  return { msg: 'Não consegui tocar este vídeo aqui dentro.', fix: 'Tente abrir no YouTube.' };
}
function showVideoError(code, item) {
  stopVideoLoop();
  videoState.playing = false;
  const bar = document.getElementById('video-bar');
  if (!bar) return;
  const info = ytErrorInfo(code);
  bar.innerHTML = `
    <div class="vb-row">
      <div class="vb-warn">!</div>
      <div class="vb-main">
        <div class="vb-title">${escapeHtml(item.title)}</div>
        <div class="vb-errmsg">${escapeHtml(info.msg)} ${escapeHtml(info.fix)}</div>
      </div>
      <button class="vb-close" id="vb-close" title="Fechar player">${icon('close')}</button>
    </div>
    <div class="vb-row vb-controls">
      <a class="vb-sync" href="${escapeHtml(item.videoUrl || videoSearchUrl(item))}" target="_blank" rel="noopener">${icon('play')}<span>Abrir no YouTube</span></a>
      <button class="vb-sync" id="vb-relink">${icon('pin')}<span>Fixar outro link</span></button>
    </div>
  `;
  document.getElementById('vb-close').addEventListener('click', destroyVideoBar);
  document.getElementById('vb-relink').addEventListener('click', () => { destroyVideoBar(); openVideoLinkModal(item); });
}

function openVideoBar(item) {
  const vid = youtubeId(item.videoUrl);
  if (!vid) { openVideoLinkModal(item); return; }
  if (videoState.itemId === item.id && videoState.player) { showToast('O player já está aberto.'); return; }
  destroyVideoBar();
  videoState.itemId = item.id;
  videoState.sync = true;
  stopAutoScroll(true);

  const bar = document.createElement('div');
  bar.className = 'video-bar' + (document.querySelector('.presentation') ? ' in-presentation' : '');
  bar.id = 'video-bar';
  bar.innerHTML = `
    <div class="vb-row">
      <div class="vb-player"><div id="yt-player"></div><div class="vb-loading" id="vb-loading">carregando</div></div>
      <div class="vb-main">
        <div class="vb-title">${escapeHtml(item.title)}</div>
        <input type="range" id="vb-seek" class="vb-seek" min="0" max="1000" value="0" step="1" aria-label="Posição do vídeo" />
        <div class="vb-time" id="vb-time">0:00 / 0:00</div>
      </div>
      <button class="vb-close" id="vb-close" title="Fechar player">${icon('close')}</button>
    </div>
    <div class="vb-row vb-controls">
      <button class="vb-play" id="vb-play" title="Tocar">${icon('play')}</button>
      <button class="vb-sync" id="vb-sync" data-on="true" title="Sincronizar a letra com o vídeo">${icon('sync')}<span>Auto sync</span></button>
      <span class="vb-offset">
        <span class="vb-offset-label">início da letra</span>
        <button id="vb-off-minus" title="Letra começa antes">−</button>
        <strong data-video-offset>${getVideoOffset(item.id)}s</strong>
        <button id="vb-off-plus" title="Letra começa depois">+</button>
      </span>
    </div>
  `;
  document.body.appendChild(bar);
  document.body.classList.add('has-video-bar');

  document.getElementById('vb-close').addEventListener('click', destroyVideoBar);
  document.getElementById('vb-play').addEventListener('click', toggleVideoPlay);
  document.getElementById('vb-sync').addEventListener('click', toggleVideoSync);
  document.getElementById('vb-off-minus').addEventListener('click', () => {
    setVideoOffset(item.id, Math.max(0, getVideoOffset(item.id) - 2)); updateVideoUi();
  });
  document.getElementById('vb-off-plus').addEventListener('click', () => {
    setVideoOffset(item.id, getVideoOffset(item.id) + 2); updateVideoUi();
  });
  const seek = document.getElementById('vb-seek');
  const beginSeek = () => { videoState.seeking = true; };
  const endSeek = () => {
    const p = videoPlayer();
    if (p && p.getDuration) {
      const dur = p.getDuration() || 0;
      if (dur > 0) p.seekTo((Number(seek.value) / 1000) * dur, true);
    }
    videoState.seeking = false;
  };
  seek.addEventListener('pointerdown', beginSeek);
  seek.addEventListener('touchstart', beginSeek, { passive: true });
  seek.addEventListener('change', endSeek);

  videoState.raf = requestAnimationFrame(videoLoop);

  loadYouTubeApi().then(YT => {
    const loading = document.getElementById('vb-loading');
    if (loading) loading.remove();
    videoState.player = new YT.Player('yt-player', {
      videoId: vid,
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0 },
      events: {
        onReady: e => { videoState.ready = true; e.target.playVideo(); updateVideoUi(); },
        onStateChange: e => {
          videoState.playing = e.data === (YT.PlayerState ? YT.PlayerState.PLAYING : 1);
          if (videoState.playing && videoState.sync) stopAutoScroll(true);
          updateVideoUi();
        },
        onError: e => showVideoError(e.data, item),
      },
    });
  }).catch(() => {
    showVideoError(null, item);
  });
}

// ---------- fixar o link do vídeo na música ----------
function openVideoLinkModal(item) {
  const cur = item.videoUrl || '';
  renderModal(`
    <div class="sheet-header">
      <h2>Fixar link do vídeo</h2>
      <button class="close-btn" id="modal-close">${icon('close')}</button>
    </div>
    <div class="field">
      <label>Link do vídeo (YouTube)</label>
      <input type="text" id="vl-input" value="${escapeHtml(cur)}" placeholder="https://www.youtube.com/watch?v=..." />
      <div class="hint">Depois de fixado, o link fica salvo nesta música: abre no player dentro do app, com tocar, pausar e o modo Auto sync para a letra acompanhar o vídeo.</div>
    </div>
    <button class="primary-btn" id="vl-save">${icon('pin')} Fixar link</button>

    ${cur ? '<button class="secondary-btn" id="vl-remove" style="color:var(--danger)">Remover link fixado</button>' : ''}
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('vl-save').addEventListener('click', () => {
    const val = document.getElementById('vl-input').value.trim();
    if (!val) { showToast('Cole o link do vídeo.'); return; }
    saveItemVideoUrl(item.id, val);
    if (!youtubeId(val)) showToast('Link salvo. O player só funciona com links do YouTube.');
    closeModal();
    render();
  });
  const rm = document.getElementById('vl-remove');
  if (rm) rm.addEventListener('click', () => {
    saveItemVideoUrl(item.id, '');
    if (videoState.itemId === item.id) destroyVideoBar();
    closeModal();
    render();
  });
}

function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [path, qs] = hash.split('?');
  const params = new URLSearchParams(qs || '');
  return { path: path || '', params };
}

function pageBusca(params) {
  const q = params.get('q') || '';
  const all = getAllItems();
  const nq = norm(q);
  const results = nq ? all.filter(s => norm(s.title + ' ' + s.composer + ' ' + s.categoria + ' ' + s.subcategoria + ' ' + s.content).includes(nq)) : [];
  return `
    <div class="container">

        <div class="search-box">${icon('search')}<input id="search-input" type="text" value="${escapeHtml(q)}" placeholder="Buscar cântico, música ou oração" autocomplete="off" /></div>

      ${renderItemList(results, { showType: true })}
    </div>
  `;
}
function bindBusca() {
  const input = document.getElementById('search-input');
  input.focus();
  input.addEventListener('input', () => {
    clearTimeout(bindBusca._t);
    bindBusca._t = setTimeout(() => { history.replaceState(null, '', `#/busca?q=${encodeURIComponent(input.value)}`); render(); }, 250);
  });
  bindItemListEvents();
}

// ---------- shared item list rendering ----------
function renderItemList(list, opts) {
  opts = opts || {};
  if (list.length === 0) {
    return `<div class="empty-state">
      ${icon('search', 'style="width:42px;height:42px"')}
      <div>Nenhum resultado encontrado.</div>
    </div>`;
  }
  let lastLetter = null;
  const rows = [];
  list.forEach(s => {
    const letter = articleStrip(s.title).charAt(0).toUpperCase() || '#';
    if (opts.grouped && letter !== lastLetter) {
      rows.push(`<div class="letter-heading">${letter}</div>`);
      lastLetter = letter;
    }
    const favs = loadFavorites();
    rows.push(`
      <div class="content-card" data-id="${escapeHtml(s.id)}">
        <span class="badge-dot" style="background:${colorFor(s.categoria)}"></span>
        <span class="info">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="sub">${escapeHtml(s.composer || 'Autor não informado')}${opts.showType ? ' · ' + (s.tipo === 'oracao' ? 'Oração' : s.tipo === 'sermao' ? 'Evangelho do dia' : 'Cântico') : ''}${s.page ? ' · pág. ' + s.page : ''}</div>
        </span>
        <span class="cat-tag" style="background:${colorFor(s.categoria)}">${escapeHtml(s.categoria)}</span>
        <button class="fav-btn" data-fav="${escapeHtml(s.id)}" data-active="${favs.has(s.id)}" title="Favoritar">${icon('heart')}</button>
      </div>`);
  });
  return `<div class="content-list">${rows.join('')}</div>`;
}
function bindItemListEvents() {
  document.querySelectorAll('.content-card').forEach(el => {
    el.addEventListener('click', e => { if (e.target.closest('.fav-btn')) return; navTo(`item/${el.dataset.id}`); });
  });
  document.querySelectorAll('.fav-btn').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.fav;
      const favs = loadFavorites();
      if (favs.has(id)) favs.delete(id); else favs.add(id);
      saveFavorites(favs);
      render();
    });
  });
}

function refreshDetailFont() {
  const pre = document.getElementById('song-pre');
  const wrap = document.getElementById('detail-content');
  if (!pre || !wrap) return;
  const hidden = wrap.classList.contains('chords-hidden');
  const delta = parseInt(localStorage.getItem(LS_FONT) || '0', 10);
  // orações e o Evangelho do dia são texto corrido: quebram linha e não precisam do
  // encaixe milimétrico que a cifra exige
  if (wrap.classList.contains('text-mode')) {
    pre.style.fontSize = Math.max(13, Math.min(28, 17 + delta)) + 'px';
    wrap.classList.remove('has-hscroll');
    return;
  }
  if (hidden) {
    pre.style.fontSize = Math.max(12, Math.min(26, 16 + delta)) + 'px';
    wrap.classList.remove('has-hscroll');
  } else {
    autoFitPre(pre, { min: 10, max: 18 });
    const base = parseFloat(pre.style.fontSize) || 15;
    pre.style.fontSize = Math.max(9, Math.min(22, base + delta)) + 'px';
  }
}
function bindDetail(id) {
  if (registerView._pending === id) { registerView(id); registerView._pending = null; }
  refreshDetailFont();
  initScrollFor(id);
  document.querySelector('[data-scroll-toggle]').addEventListener('click', toggleAutoScroll);
  document.getElementById('scroll-slower').addEventListener('click', () => changeScrollLevel(-1));
  document.getElementById('scroll-faster').addEventListener('click', () => changeScrollLevel(1));
  const sbVideo = document.getElementById('sb-video');
  if (sbVideo) sbVideo.addEventListener('click', () => openVideoBar(findItem(id)));
  document.getElementById('back-btn').addEventListener('click', () => history.back());

}
function saveItemVideoUrl(id, url) {
  const s = findItem(id);
  if (!s) return;
  if (s.mine) {
    saveUserItems(loadUserItems().map(x => x.id === id ? { ...x, videoUrl: url || undefined } : x));
  } else {
    const edits = loadEdits();
    edits[id] = { ...(edits[id] || {}), videoUrl: url || undefined };
    saveEdits(edits);
  }
  showToast(url ? 'Link fixado nesta música.' : 'Link removido.');
}
function setFontSize(delta) {
  let v = parseInt(localStorage.getItem(LS_FONT) || '0', 10) + delta;
  v = Math.max(-4, Math.min(8, v));
  localStorage.setItem(LS_FONT, String(v));
  refreshDetailFont();
}
function confirmDelete(id) {
  const s = findItem(id);
  if (!s) return;
  if (!confirm(`Remover "${s.title}" do acervo?`)) return;
  if (hasPdf(s)) deletePdf(id);
  if (s.mine) saveUserItems(loadUserItems().filter(x => x.id !== id));
  else { const d = loadDeleted(); if (!d.includes(id)) d.push(id); saveDeleted(d); }
  history.back();
  setTimeout(() => showToast('Item removido.'), 250);
}

function bindModoCulto() {
  const input = document.getElementById('culto-add-search');
  const resultsBox = document.getElementById('culto-search-results');
  input.addEventListener('input', () => {
    const q = norm(input.value);
    if (!q) { resultsBox.innerHTML = ''; return; }
    const current = getActivePlaylist().items;
    const matches = getAllItems().filter(s => !current.includes(s.id) && norm(s.title + ' ' + s.composer).includes(q)).slice(0, 8);
    resultsBox.innerHTML = matches.map(s => `<div class="csr-item" data-id="${escapeHtml(s.id)}"><span>${escapeHtml(s.title)}</span>${icon('plus', 'style="width:15px;height:15px"')}</div>`).join('') || '<div style="font-size:13px;color:var(--text-faint);padding:6px">Nada encontrado.</div>';
    resultsBox.querySelectorAll('.csr-item').forEach(el => el.addEventListener('click', () => {
      addToActivePlaylist(el.dataset.id);
      input.value = '';
      resultsBox.innerHTML = '';
      render();
    }));
  });
  document.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => {
    saveActivePlaylistItems(getActivePlaylist().items.filter(id => id !== el.dataset.remove));
    render();
  }));
  document.querySelectorAll('.playlist-chip[data-pl]').forEach(el => el.addEventListener('click', () => {
    setActivePlaylistId(el.dataset.pl);
    render();
  }));
  const newBtn = document.getElementById('playlist-new');
  if (newBtn) newBtn.addEventListener('click', () => {
    const name = prompt('Nome da nova playlist:', '');
    if (name === null) return;
    createPlaylist(name);
    render();
  });
  const shareBtn = document.getElementById('playlist-share');
  if (shareBtn) shareBtn.addEventListener('click', () => sharePlaylist(getActivePlaylist()));
  const receiveBtn = document.getElementById('playlist-receive');
  if (receiveBtn) receiveBtn.addEventListener('click', askForSharedFile);
  const renameBtn = document.getElementById('playlist-rename');
  if (renameBtn) renameBtn.addEventListener('click', () => {
    const active = getActivePlaylist();
    const name = prompt('Novo nome da playlist:', active.name);
    if (name === null) return;
    renamePlaylist(active.id, name);
    render();
  });
  const deleteBtn = document.getElementById('playlist-delete');
  if (deleteBtn) deleteBtn.addEventListener('click', () => {
    const active = getActivePlaylist();
    if (!confirm(`Excluir a playlist "${active.name}"?`)) return;
    deletePlaylist(active.id);
    render();
  });
  const startBtn = document.getElementById('start-presentation');
  if (startBtn) startBtn.addEventListener('click', () => navTo('modo-missa/apresentacao'));
  const clearBtn = document.getElementById('clear-setlist');
  if (clearBtn) clearBtn.addEventListener('click', () => { if (confirm('Esvaziar esta playlist?')) { saveActivePlaylistItems([]); render(); } });

  // simple drag-reorder
  let dragId = null;
  document.querySelectorAll('.setlist-item').forEach(el => {
    el.addEventListener('dragstart', () => { dragId = el.dataset.id; });
    el.addEventListener('dragover', e => e.preventDefault());
    el.addEventListener('drop', () => {
      if (!dragId || dragId === el.dataset.id) return;
      const list = getActivePlaylist().items.slice();
      const from = list.indexOf(dragId);
      const to = list.indexOf(el.dataset.id);
      list.splice(from, 1);
      list.splice(to, 0, dragId);
      saveActivePlaylistItems(list);
      render();
    });
  });
}

        </div>
      </div>
    </div>
  `;
}
function refreshPresentationFont() {
  const pre = document.getElementById('pres-pre');
  const body = document.getElementById('pres-body');
  if (!pre || !body) return;
  const hidden = body.classList.contains('chords-hidden');
  const delta = parseInt(localStorage.getItem(LS_FONT) || '0', 10);
  if (body.classList.contains('text-mode')) {
    pre.style.fontSize = Math.max(15, Math.min(32, 20 + delta)) + 'px';
    body.classList.remove('has-hscroll');
    return;
  }
  if (hidden) {
    pre.style.fontSize = Math.max(14, Math.min(30, 19 + delta)) + 'px';
    body.classList.remove('has-hscroll');
  } else {
    autoFitPre(pre, { min: 10, max: 22 });
    const base = parseFloat(pre.style.fontSize) || 17;
    pre.style.fontSize = Math.max(10, Math.min(28, base + delta)) + 'px';
  }
}
function bindPresentation() {
  const setlist = getActivePlaylist().items;
  const current = setlist[presState.index];
  refreshPresentationFont();
  // ao passar para a próxima música, o vídeo da anterior não continua
  if (videoState.itemId && videoState.itemId !== current) destroyVideoBar();
  initScrollFor(current);
  document.querySelector('[data-scroll-toggle]').addEventListener('click', toggleAutoScroll);
  document.getElementById('pres-scroll-slower').addEventListener('click', () => changeScrollLevel(-1));
  document.getElementById('pres-scroll-faster').addEventListener('click', () => changeScrollLevel(1));
  const presVideo = document.getElementById('pres-video');
  if (presVideo) presVideo.addEventListener('click', () => openVideoBar(findItem(current)));
  document.getElementById('pres-exit').addEventListener('click', () => { presState.index = 0; destroyVideoBar(); navTo('modo-missa'); });
  const prev = document.getElementById('pres-prev');
  const next = document.getElementById('pres-next');
  if (prev) prev.addEventListener('click', () => { presState.index = Math.max(0, presState.index - 1); render(); });
  if (next) next.addEventListener('click', () => { presState.index = Math.min(setlist.length - 1, presState.index + 1); render(); });
  const presChords = document.getElementById('pres-chords');
  if (presChords) presChords.addEventListener('click', () => {
    localStorage.setItem(LS_CHORDS, defaultChordsHidden() ? 'false' : 'true');
    render();
  });
  document.getElementById('pres-font-minus').addEventListener('click', () => { setFontSize(-1); refreshPresentationFont(); });
  document.getElementById('pres-font-plus').addEventListener('click', () => { setFontSize(1); refreshPresentationFont(); });
  document.addEventListener('keydown', presKeyHandler);
  // basic swipe
  let touchX = null;
  const body = document.querySelector('.p-body');
  if (body) {
    body.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
    body.addEventListener('touchend', e => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 60) {
        if (dx < 0 && next && !next.disabled) next.click();
        if (dx > 0 && prev && !prev.disabled) prev.click();
      }
      touchX = null;
    });
  }
}
function presKeyHandler(e) {
  if (!document.querySelector('.presentation')) { document.removeEventListener('keydown', presKeyHandler); return; }
  if (e.key === 'ArrowRight') document.getElementById('pres-next')?.click();
  if (e.key === 'ArrowLeft') document.getElementById('pres-prev')?.click();
  if (e.key === 'Escape') document.getElementById('pres-exit')?.click();
}

/* =========================================================
   COMPARTILHAR POR ARQUIVO
   Um .json que sai de um celular e entra em outro. Vai junto
   a letra, a cifra, a categoria e o link de vídeo fixado; no
   caso de playlist, vai a lista inteira com todas as músicas,
   para funcionar mesmo em quem ainda não as tem.
   ========================================================= */
const SHARE_APP = 'acervo-igreja';
const SHARE_VERSION = 1;
const SHARE_FIELDS = ['id', 'tipo', 'title', 'composer', 'categoria', 'subcategoria', 'page',
  'content', 'videoUrl', 'devocao', 'data', 'textoBase', 'introducao', 'pontos', 'conclusao', 'apelo'];

// busca sem passar pelos filtros de exibição
function findItemAny(id) {
  const edits = loadEdits();
  const base = LIBRARY_DATA.find(s => s.id === id);
  if (base) return edits[id] ? { ...base, ...edits[id] } : base;
  return loadUserItems().find(s => s.id === id);
}
function sharePayload(item) {
  const out = {};
  SHARE_FIELDS.forEach(k => { if (item[k] !== undefined && item[k] !== null) out[k] = item[k]; });
  return out;
}
function fileSlug(t) {
  return (t || 'acervo').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 42) || 'acervo';
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}
// No celular abre o menu do sistema (WhatsApp, e-mail...); no computador baixa.
function deliverShareFile(data, filename) {
  const json = JSON.stringify(data, null, 1);
  const blob = new Blob([json], { type: 'application/json' });
  try {
    const file = new File([blob], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: data.titulo || 'Acervo da Igreja' })
        .then(() => showToast('Pronto para enviar.'))
        .catch(err => { if (!err || err.name !== 'AbortError') downloadBlob(blob, filename); });
      return;
    }
  } catch (e) { /* navegador sem compartilhamento de arquivo */ }
  downloadBlob(blob, filename);
  showToast('Arquivo baixado. Agora é só enviar.');
}
function shareItem(item) {
  if (!item) return;
  deliverShareFile({
    app: SHARE_APP, versao: SHARE_VERSION, tipo: 'itens', titulo: item.title,
    itens: [sharePayload(item)],
  }, fileSlug(item.title) + '.acervo.json');
}
function sharePlaylist(pl) {
  const itens = (pl.items || []).map(findItemAny).filter(Boolean).map(sharePayload);
  if (!itens.length) { showToast('Essa playlist está vazia.'); return; }
  deliverShareFile({
    app: SHARE_APP, versao: SHARE_VERSION, tipo: 'playlist', titulo: pl.name,
    playlist: { nome: pl.name, ordem: itens.map(i => i.id) },
    itens,
  }, fileSlug(pl.name) + '.playlist.json');
}
function shareMyItems() {
  const itens = loadUserItems().map(sharePayload);
  const edits = loadEdits();
  if (!itens.length && !Object.keys(edits).length) { showToast('Você ainda não adicionou nem editou nada.'); return; }
  deliverShareFile({
    app: SHARE_APP, versao: SHARE_VERSION, tipo: 'meus-itens', titulo: 'Meus itens',
    itens, edicoes: edits, favoritos: [...loadFavorites()], playlists: loadPlaylists(),
    agenda: loadAgenda(),
  }, 'meu-acervo.json');
}

// ---------- receber ----------
function applySharedItems(itens) {
  const baseIds = new Set(LIBRARY_DATA.map(s => s.id));
  const user = loadUserItems();
  const userIds = new Set(user.map(s => s.id));
  const edits = loadEdits();
  let novos = 0, existentes = 0, links = 0;
  itens.forEach(it => {
    if (!it || !it.id || !it.title) return;
    if (baseIds.has(it.id)) {
      existentes++;
      const meu = findItemAny(it.id);
      if (it.videoUrl && !(meu && meu.videoUrl)) {
        edits[it.id] = { ...(edits[it.id] || {}), videoUrl: it.videoUrl };
        links++;
      }
    } else if (userIds.has(it.id)) {
      existentes++;
    } else {
      user.push({ ...it, views: 0 });
      userIds.add(it.id);
      novos++;
    }
  });
  saveUserItems(user);
  saveEdits(edits);
  // o que acabou de chegar não pode ficar escondido por uma remoção antiga
  saveDeleted(loadDeleted().filter(id => !itens.some(i => i && i.id === id)));
  return { novos, existentes, links };
}
function createPlaylistFromShare(pl, itens) {
  const pls = loadPlaylists();
  const nomeBase = (pl.nome || 'Playlist recebida').trim();
  let nome = nomeBase, n = 2;
  while (pls.some(p => p.name === nome)) { nome = `${nomeBase} (${n})`; n++; }
  const id = 'pl-' + Date.now().toString(36);
  pls.push({ id, name: nome, items: (pl.ordem || itens.map(i => i.id)).filter(Boolean) });
  savePlaylists(pls);
  setActivePlaylistId(id);
  return nome;
}
function handleSharedFile(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (err) { showToast('Arquivo inválido.'); return; }

    // backups antigos, do formato anterior
    if (!data.app && (data.items || data.edits || data.favorites)) {
      if (Array.isArray(data.items)) applySharedItems(data.items.map(sharePayload));
      if (data.edits) saveEdits({ ...loadEdits(), ...data.edits });
      if (Array.isArray(data.favorites)) saveFavorites(new Set([...loadFavorites(), ...data.favorites]));
      showToast('Backup importado.');
      render();
      return;
    }
    if (data.app !== SHARE_APP || !Array.isArray(data.itens)) {
      showToast('Esse arquivo não é do Acervo.');
      return;
    }
    const res = applySharedItems(data.itens);
    let msg;
    if (data.tipo === 'playlist' && data.playlist) {
      const nome = createPlaylistFromShare(data.playlist, data.itens);
      msg = `Playlist "${nome}" recebida (${data.itens.length} ${data.itens.length === 1 ? 'item' : 'itens'}).`;
    } else {
      msg = res.novos
        ? `${res.novos} ${res.novos === 1 ? 'item novo' : 'itens novos'} adicionado${res.novos === 1 ? '' : 's'}.`
        : 'Você já tinha tudo desse arquivo.';
      if (res.links) msg += ` ${res.links} link(s) de vídeo.`;
    }
    if (data.tipo === 'meus-itens') {
      if (Array.isArray(data.favoritos)) saveFavorites(new Set([...loadFavorites(), ...data.favoritos]));
      if (data.edicoes) saveEdits({ ...loadEdits(), ...data.edicoes });
      if (Array.isArray(data.agenda)) {
        const ag = loadAgenda();
        data.agenda.forEach(c => { if (!ag.some(x => x.id === c.id)) ag.push(c); });
        saveAgenda(ag);
      }
      if (Array.isArray(data.playlists)) {
        const pls = loadPlaylists();
        data.playlists.forEach(p => { if (!pls.some(x => x.name === p.name)) pls.push({ ...p, id: 'pl-' + Math.random().toString(36).slice(2, 9) }); });
        savePlaylists(pls);
      }
    }
    showToast(msg);
    render();
  };
  reader.readAsText(file);
}
function askForSharedFile() {
  let input = document.getElementById('shared-file-input');
  if (!input) {
    input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.id = 'shared-file-input';
    input.style.display = 'none';
    input.addEventListener('change', handleSharedFile);
    document.body.appendChild(input);
  }
  input.click();
}

/* =========================================================
   EVANGELHO DO DIA — montagem por partes
   Os campos ficam guardados separados (para reeditar) e o
   texto corrido montado vai em .content, que é o que o resto
   do app já sabe exibir, buscar, projetar e imprimir.
   ========================================================= */
function buildSermaoContent(s) {
  const blocos = [];
  if (s.textoBase) blocos.push(`TEXTO BASE\n${s.textoBase}`);
  if (s.introducao) blocos.push(`INTRODUÇÃO\n${s.introducao}`);
  (s.pontos || []).forEach((p, i) => {
    if (!p.titulo && !p.texto) return;
    blocos.push(`${i + 1}. ${(p.titulo || 'PONTO ' + (i + 1)).toUpperCase()}\n${p.texto || ''}`.trim());
  });
  if (s.conclusao) blocos.push(`CONCLUSÃO\n${s.conclusao}`);
  if (s.apelo) blocos.push(`APELO\n${s.apelo}`);
  return blocos.join('\n\n').trim();
}
function fmtDataBr(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return d && m && y ? `${d}/${m}/${y}` : iso;
}

let sermaoDraft = null;
function openSermaoModal(existing) {
  sermaoDraft = existing
    ? { ...existing, pontos: (existing.pontos || []).map(p => ({ ...p })) }
    : { title: '', composer: '', categoria: '', data: new Date().toISOString().slice(0, 10),
        textoBase: '', introducao: '', pontos: [{ titulo: '', texto: '' }], conclusao: '', apelo: '' };
  if (!sermaoDraft.pontos || !sermaoDraft.pontos.length) sermaoDraft.pontos = [{ titulo: '', texto: '' }];
  renderModal(sermaoModalHtml(!!(existing && existing.id)));
  bindSermaoModal(existing);
}
function sermaoModalHtml(isEdit) {

  return `
    <div class="sheet-header">

    <div class="field">

function sermaoPontosHtml() {
  return sermaoDraft.pontos.map((p, i) => `
    <div class="ponto-card" data-i="${i}">
      <div class="ponto-top">
        <span class="ponto-num">${i + 1}</span>

      </div>
      <textarea class="ponto-texto" placeholder="Desenvolvimento, versículos, ilustrações...">${escapeHtml(p.texto || '')}</textarea>
    </div>`).join('');
}
// Guarda o que já foi digitado antes de redesenhar a lista de pontos.
function readSermaoPontos() {
  const cards = document.querySelectorAll('#sm-pontos .ponto-card');
  if (!cards.length) return;
  sermaoDraft.pontos = [...cards].map(c => ({
    titulo: c.querySelector('.ponto-titulo').value,
    texto: c.querySelector('.ponto-texto').value,
  }));
}
function renderSermaoPontos() {
  document.getElementById('sm-pontos').innerHTML = sermaoPontosHtml();
  bindSermaoPontos();
}
function bindSermaoPontos() {
  document.querySelectorAll('[data-del-ponto]').forEach(btn => btn.addEventListener('click', () => {
    readSermaoPontos();
    sermaoDraft.pontos.splice(Number(btn.dataset.delPonto), 1);
    if (!sermaoDraft.pontos.length) sermaoDraft.pontos = [{ titulo: '', texto: '' }];
    renderSermaoPontos();
  }));
}
function bindSermaoModal(existing) {
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('sm-cancel').addEventListener('click', closeModal);
  bindSermaoPontos();
  document.getElementById('sm-add-ponto').addEventListener('click', () => {
    readSermaoPontos();
    sermaoDraft.pontos.push({ titulo: '', texto: '' });
    renderSermaoPontos();
  });
  document.getElementById('sm-save').addEventListener('click', async () => {
    readSermaoPontos();
    const title = document.getElementById('sm-title').value.trim();
    if (!title) { showToast('Informe o tema.'); return; }
    const draft = {
      title,
      composer: document.getElementById('sm-pregador').value.trim(),
      data: document.getElementById('sm-data').value,
      categoria: document.getElementById('sm-categoria').value || 'Outros',
      textoBase: document.getElementById('sm-texto').value.trim(),
      introducao: document.getElementById('sm-intro').value.trim(),
      pontos: sermaoDraft.pontos,
      conclusao: document.getElementById('sm-conclusao').value.trim(),
      apelo: document.getElementById('sm-apelo').value.trim(),
    };
    draft.content = buildSermaoContent(draft);
    if (!draft.content) { showToast('Preencha ao menos uma parte.'); return; }

    const id = existing && existing.id ? existing.id : slugify(title, Date.now().toString(36));
    const saveBtn = document.getElementById('sm-save');
    const pdfFile = document.getElementById('sm-pdf').files[0];
    let pdfName = existing ? existing.pdfName : undefined;
    let hasPdfFlag = existing ? existing.hasPdf : undefined;
    if (pdfFile) {
      saveBtn.textContent = 'Salvando PDF...';
      saveBtn.disabled = true;
      try { await savePdf(id, pdfFile); pdfName = pdfFile.name; hasPdfFlag = true; }
      catch (e) { showToast('Não consegui salvar o PDF.'); saveBtn.disabled = false; saveBtn.textContent = 'Salvar'; return; }
    }

    const item = { ...(existing || {}), ...draft, id, tipo: 'sermao', subcategoria: draft.categoria,
                   pdfName, hasPdf: hasPdfFlag, views: (existing && existing.views) || 0 };
    const list = loadUserItems();
    const idx = list.findIndex(x => x.id === id);
    if (idx >= 0) list[idx] = item; else list.push(item);
    saveUserItems(list);

/* =========================================================
   BÍBLIA — Almeida Revista e Corrigida (1914, domínio público)
   Os 31.100 versículos ficam num arquivo à parte (biblia-data.js),
   carregado só quando alguém abre a aba, para não pesar a abertura
   do app. Busca por referência ("Jo 3:16") e por trecho de texto.
   ========================================================= */
let bibliaState = { view: 'livros', livro: null, cap: null, query: '', carregando: false, erro: false };

function bibliaPronta() { return typeof BIBLIA_DATA !== 'undefined'; }
function carregarBiblia() {
  if (bibliaPronta()) return Promise.resolve();
  if (carregarBiblia._p) return carregarBiblia._p;
  carregarBiblia._p = new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = 'biblia-data.js';
    tag.onload = () => resolve();
    tag.onerror = () => reject(new Error('falhou'));
    document.head.appendChild(tag);
  });
  return carregarBiblia._p;
}
// "Jo" é João e "Jó" é Jó: aqui o acento decide, então a primeira tentativa
// compara sem tirar acentos. Sem acento nenhum, "jo" vai para João.
const BIB_APELIDOS = { 'jo': 'João', 'job': 'Jó', 'jó': 'Jó', 'joao': 'João', 'joão': 'João' };
function livroPorNome(txt) {
  const cru = (txt || '').trim().toLowerCase().replace(/\.$/, '');
  if (!cru) return null;
  let achado = BIBLIA_DATA.find(l => l.n.toLowerCase() === cru || l.a.toLowerCase() === cru);
  if (achado) return achado;
  if (BIB_APELIDOS[cru]) return BIBLIA_DATA.find(l => l.n === BIB_APELIDOS[cru]);
  const n = norm(cru);
  achado = BIBLIA_DATA.find(l => norm(l.n) === n || norm(l.a) === n);
  if (achado) return achado;
  return BIBLIA_DATA.find(l => norm(l.n).startsWith(n) || norm(l.a).startsWith(n)) || null;
}
// "Jo 3:16", "João 3.16", "Salmos 23", "1 Co 13:4-7"
function lerReferencia(q) {
  const m = q.trim().match(/^(\d?\s?[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\s.]*?)\s*(\d+)(?:\s*[:.]\s*(\d+)(?:\s*-\s*(\d+))?)?\s*$/);
  if (!m) return null;
  const livro = livroPorNome(m[1]);
  if (!livro) return null;
  const cap = parseInt(m[2], 10);
  if (!livro.c[cap - 1]) return null;
  return { livro, cap, vIni: m[3] ? parseInt(m[3], 10) : null, vFim: m[4] ? parseInt(m[4], 10) : null };
}
function buscarNaBiblia(q) {
  const n = norm(q);
  if (n.length < 3) return [];
  const out = [];
  for (const l of BIBLIA_DATA) {
    for (let ci = 0; ci < l.c.length; ci++) {
      const cap = l.c[ci];
      for (let vi = 0; vi < cap.length; vi++) {
        if (norm(cap[vi]).includes(n)) {
          out.push({ livro: l, cap: ci + 1, ver: vi + 1, txt: cap[vi] });
          if (out.length >= 200) return out;
        }
      }
    }
  }
  return out;
}
function realceHtml(txt, q) {
  const n = norm(q), alvo = norm(txt);
  const i = alvo.indexOf(n);
  if (i < 0) return escapeHtml(txt);
  return escapeHtml(txt.slice(0, i)) + '<mark>' + escapeHtml(txt.slice(i, i + q.length)) + '</mark>' + escapeHtml(txt.slice(i + q.length));
}

function pageBiblia() {
  if (!bibliaPronta()) {
    return `
      <div class="container">
        <div class="section" style="padding-top:26px">
          <h2 class="section-title">Bíblia Sagrada</h2>
          <p class="section-sub">Almeida Revista e Corrigida</p>
        </div>
        <div class="empty-state">
          ${bibliaState.erro
            ? `<div>Não consegui carregar a Bíblia.</div><div class="cta" style="font-size:13px;color:var(--text-faint);max-width:380px;margin:8px auto 0">O arquivo <strong>biblia-data.js</strong> precisa estar na mesma pasta do app.</div>`
            : `<div>Carregando a Bíblia...</div><div class="cta" style="font-size:12.5px;color:var(--text-faint)">São 31.100 versículos, só na primeira vez.</div>`}
        </div>
      </div>`;
  }
  const q = bibliaState.query.trim();
  let miolo = '';

  if (q) {
    const ref = lerReferencia(q);
    if (ref) {
      miolo = versiculosHtml(ref.livro, ref.cap, ref.vIni, ref.vFim);
    } else {
      const res = buscarNaBiblia(q);
      miolo = `<div class="meta-row"><span>${res.length}${res.length >= 200 ? '+' : ''} ocorrência${res.length === 1 ? '' : 's'}</span></div>` +
        (res.length ? `<div class="content-list">${res.map(r => `
          <div class="verso-card" data-ref="${escapeHtml(r.livro.n)}|${r.cap}">
            <div class="verso-ref">${escapeHtml(r.livro.n)} ${r.cap}:${r.ver}</div>
            <div class="verso-txt">${realceHtml(r.txt, q)}</div>
          </div>`).join('')}</div>`
          : `<div class="empty-state"><div>Nada encontrado. Tente um trecho maior, ou uma referência como "Jo 3:16".</div></div>`);
    }
  } else if (bibliaState.view === 'texto' && bibliaState.livro) {
    const l = BIBLIA_DATA.find(x => x.n === bibliaState.livro);
    miolo = versiculosHtml(l, bibliaState.cap);
  } else if (bibliaState.view === 'capitulos' && bibliaState.livro) {
    const l = BIBLIA_DATA.find(x => x.n === bibliaState.livro);
    miolo = `
      <button class="back-btn" id="bib-voltar-livros">${icon('back')} Todos os livros</button>
      <h3 class="bib-titulo">${escapeHtml(l.n)}</h3>
      <div class="cap-grid">${l.c.map((_, i) => `<button class="cap-btn" data-cap="${i + 1}">${i + 1}</button>`).join('')}</div>`;
  } else {
    const grupo = t => BIBLIA_DATA.filter(l => l.t === t).map(l => `
      <button class="livro-btn" data-livro="${escapeHtml(l.n)}">
        <span class="livro-nome">${escapeHtml(l.n)}</span>
        <span class="livro-caps">${l.c.length}</span>
      </button>`).join('');
    miolo = `
      <div class="bib-secao">Velho Testamento</div>
      <div class="livro-grid">${grupo('VT')}</div>
      <div class="bib-secao">Novo Testamento</div>
      <div class="livro-grid">${grupo('NT')}</div>`;
  }

  return `
    <div class="container">
      <div class="section" style="padding-top:26px">
        <h2 class="section-title">Bíblia Sagrada</h2>
        <p class="section-sub">Almeida Revista e Corrigida · busque por referência (Jo 3:16) ou por um trecho</p>
      </div>
      <div class="search-row">
        <div class="search-box">${icon('search')}<input id="bib-search" type="text" placeholder="Ex: João 3:16, Salmos 23 ou bom pastor" value="${escapeHtml(bibliaState.query)}" autocomplete="off" /></div>
      </div>
      ${miolo}
    </div>`;
}
function versiculosHtml(l, cap, vIni, vFim) {
  const versos = l.c[cap - 1] || [];
  const ini = vIni ? vIni : 1;
  const fim = vFim ? vFim : (vIni ? vIni : versos.length);
  const lista = [];
  for (let n = ini; n <= Math.min(fim, versos.length); n++) {
    lista.push(`<p class="versiculo"><span class="v-num">${n}</span>${escapeHtml(versos[n - 1])}</p>`);
  }
  return `
    <div class="bib-nav">
      <button class="back-btn" id="bib-voltar-caps">${icon('back')} ${escapeHtml(l.n)}</button>
      <div class="bib-passos">
        <button id="bib-prev" ${cap <= 1 ? 'disabled' : ''}>${icon('chevronL')}</button>
        <span>Capítulo ${cap}</span>
        <button id="bib-next" ${cap >= l.c.length ? 'disabled' : ''}>${icon('chevronR')}</button>
      </div>
    </div>
    <div class="detail-content text-mode bib-texto" id="bib-conteudo">${lista.join('')}</div>
    <div class="toolbar">
      <button id="bib-copiar">${icon('share')} Copiar trecho</button>
      <button id="bib-evangelho">${icon('book')} Usar no Evangelho do dia</button>
    </div>`;
}
function bindBiblia() {
  if (!bibliaPronta()) {
    if (!bibliaState.carregando && !bibliaState.erro) {
      bibliaState.carregando = true;
      carregarBiblia().then(() => { bibliaState.carregando = false; render(); })
        .catch(() => { bibliaState.carregando = false; bibliaState.erro = true; render(); });
    }
    return;
  }
  const input = document.getElementById('bib-search');
  input.addEventListener('input', e => {
    clearTimeout(bindBiblia._t);
    const val = e.target.value;
    bindBiblia._t = setTimeout(() => { bibliaState.query = val; render(); focusEnd('bib-search'); }, 300);
  });
  document.querySelectorAll('[data-livro]').forEach(el => el.addEventListener('click', () => {
    bibliaState.livro = el.dataset.livro; bibliaState.view = 'capitulos'; bibliaState.query = ''; render();
  }));
  document.querySelectorAll('[data-cap]').forEach(el => el.addEventListener('click', () => {
    bibliaState.cap = Number(el.dataset.cap); bibliaState.view = 'texto'; render();
  }));
  document.querySelectorAll('[data-ref]').forEach(el => el.addEventListener('click', () => {
    const [livro, cap] = el.dataset.ref.split('|');
    bibliaState.livro = livro; bibliaState.cap = Number(cap);
    bibliaState.view = 'texto'; bibliaState.query = ''; render();
  }));
  const vl = document.getElementById('bib-voltar-livros');
  if (vl) vl.addEventListener('click', () => { bibliaState.view = 'livros'; bibliaState.query = ''; render(); });
  const vc = document.getElementById('bib-voltar-caps');
  if (vc) vc.addEventListener('click', () => { bibliaState.view = 'capitulos'; bibliaState.query = ''; render(); });
  const prev = document.getElementById('bib-prev');
  if (prev) prev.addEventListener('click', () => { bibliaState.cap--; bibliaState.query = ''; render(); });
  const next = document.getElementById('bib-next');
  if (next) next.addEventListener('click', () => { bibliaState.cap++; bibliaState.query = ''; render(); });
  const cp = document.getElementById('bib-copiar');
  if (cp) cp.addEventListener('click', () => {
    const el = document.getElementById('bib-conteudo');
    const txt = `${bibliaState.livro} ${bibliaState.cap}\n\n` + el.innerText;
    navigator.clipboard.writeText(txt).then(() => showToast('Trecho copiado.')).catch(() => showToast('Não consegui copiar.'));
  });
  const ev = document.getElementById('bib-evangelho');
  if (ev) ev.addEventListener('click', () => {
    const l = BIBLIA_DATA.find(x => x.n === bibliaState.livro);
    openSermaoModal(null);
    setTimeout(() => {
      const campo = document.getElementById('sm-texto');
      if (campo) campo.value = `${l.n} ${bibliaState.cap}`;
    }, 60);
  });
}

const LS_AGENDA = 'gf_agenda_v1';
const AGENDA_TIPOS = ['Missa', 'Ensaio', 'Reunião', 'Visita', 'Evento', 'Outro'];
function loadAgenda() { return lsGet(LS_AGENDA, []); }
function saveAgenda(l) { lsSet(LS_AGENDA, l); }
function hojeISO() { return new Date().toISOString().slice(0, 10); }

function pageAgenda() {

  return `
    <div class="container">
      <div class="section" style="padding-top:26px">

        <div class="empty-state">

        ${passados.length ? `<div class="bib-secao">Já aconteceram</div><div class="content-list agenda-passados">${passados.map(cartao).join('')}</div>` : ''}
      `}

function bindAgenda() {
  document.getElementById('ag-add').addEventListener('click', () => openAgendaModal(null));
  const p = document.getElementById('ag-primeiro');
  if (p) p.addEventListener('click', () => openAgendaModal(null));
  document.querySelectorAll('[data-ag]').forEach(el => el.addEventListener('click', () => {
    const c = loadAgenda().find(x => x.id === el.dataset.ag);
    if (c) openAgendaModal(c);
  }));
}
function openAgendaModal(c) {
  const novo = !c;
  c = c || { id: '', titulo: '', data: hojeISO(), hora: '', local: '', obs: '', tipo: 'Missa' };
  renderModal(`
    <div class="sheet-header">
      <h2>${novo ? 'Marcar compromisso' : 'Editar compromisso'}</h2>
      <button class="close-btn" id="modal-close">${icon('close')}</button>
    </div>
    <div class="field"><label>O que é</label><input type="text" id="ag-titulo" value="${escapeHtml(c.titulo)}" placeholder="Ex: Missa de domingo" /></div>
    <div class="two-cols">
      <div class="field"><label>Data</label><input type="date" id="ag-data" value="${escapeHtml(c.data)}" /></div>
      <div class="field"><label>Hora</label><input type="time" id="ag-hora" value="${escapeHtml(c.hora || '')}" /></div>
    </div>
    <div class="field"><label>Local</label><input type="text" id="ag-local" value="${escapeHtml(c.local || '')}" placeholder="Ex: Igreja matriz" /></div>
    <div class="field">
      <label>Tipo</label>
      <select id="ag-tipo">${AGENDA_TIPOS.map(t => `<option value="${t}" ${c.tipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Observações</label><textarea id="ag-obs" placeholder="Quem participa, o que levar...">${escapeHtml(c.obs || '')}</textarea></div>
    <button class="primary-btn" id="ag-salvar">${novo ? 'Marcar' : 'Salvar alterações'}</button>
    ${novo ? '' : '<button class="secondary-btn" id="ag-excluir" style="color:var(--danger)">Excluir compromisso</button>'}
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('ag-salvar').addEventListener('click', () => {
    const titulo = document.getElementById('ag-titulo').value.trim();
    const data = document.getElementById('ag-data').value;
    if (!titulo) { showToast('Informe o compromisso.'); return; }
    if (!data) { showToast('Informe a data.'); return; }
    const reg = {
      id: c.id || 'ag-' + Date.now().toString(36),
      titulo, data,
      hora: document.getElementById('ag-hora').value,
      local: document.getElementById('ag-local').value.trim(),
      tipo: document.getElementById('ag-tipo').value,
      obs: document.getElementById('ag-obs').value.trim(),
    };
    const lista = loadAgenda();
    const i = lista.findIndex(x => x.id === reg.id);
    if (i >= 0) lista[i] = reg; else lista.push(reg);
    saveAgenda(lista);
    showToast(novo ? 'Compromisso marcado.' : 'Compromisso atualizado.');
    closeModal();
    render();
  });
  const ex = document.getElementById('ag-excluir');
  if (ex) ex.addEventListener('click', () => {
    if (!confirm(`Excluir "${c.titulo}"?`)) return;
    saveAgenda(loadAgenda().filter(x => x.id !== c.id));
    closeModal();
    render();
  });
}

// ---------- FORM / IMPORT MODAL (add/edit) ----------
let modalTab = 'form';
let modalDefaultTipo = 'cantico';
function openFormModal(existing, defaultTipo) {

function renderModal(html) {

}
function closeModal() { const el = document.getElementById('modal-overlay'); if (el) el.remove(); }

function modalHtml(existing) {
  const isEdit = !!(existing && existing.id);
  return `
    <div class="sheet-header">
      <h2>${isEdit ? 'Editar item' : 'Adicionar ao acervo'}</h2>
